name: Setup Intel oneAPI
description: Install and configure Intel oneAPI for SYCL builds

inputs:
  version:
    description: oneAPI version to install
    required: false
    default: "2025.3.2.0"
  installer-url:
    description: Direct download URL for the oneAPI BaseKit offline installer (Windows only)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install oneAPI (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
        echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

    - name: Install oneAPI (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ONEAPI_VERSION: ${{ inputs.version }}
        ONEAPI_INSTALLER_URL: ${{ inputs.installer-url }}
      run: |
        $ErrorActionPreference = "Stop"
        if (-not $env:ONEAPI_INSTALLER_URL) {
          Write-Error "installer-url input is required on Windows"
          exit 1
        }
        $installer = "C:\oneAPI-installer.exe"
        if (-not (Test-Path $installer)) {
          Invoke-WebRequest -Uri $env:ONEAPI_INSTALLER_URL -OutFile $installer
        }
        $proc = Start-Process $installer `
          -ArgumentList '-s', '-a', '--action', 'install', '--eula', 'accept', '--components', 'intel.oneapi.win.compiler, intel.oneapi.win.dpcpp_debugger, intel.oneapi.win.mkl.devel, intel.oneapi.win.tbb.devel' `
          -NoNewWindow -PassThru
        if (-not $proc.WaitForExit(600000)) { $proc.Kill(); exit 1 }
        if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

    - name: Setup oneAPI environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
        if (-not (Test-Path $setvars)) { Write-Error "oneAPI setvars.bat not found"; exit 1 }
        $envDump = cmd /c "`"$setvars`" intel64 > nul 2>&1 && set"
        foreach ($line in $envDump) {
          if ($line -match '^([^=]+)=(.*)$') {
            $name = $Matches[1]; $value = $Matches[2]
            if ($name -in @('PROMPT','PS1','TEMP','TMP')) { continue }
            Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
          }
        }
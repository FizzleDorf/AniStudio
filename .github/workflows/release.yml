name: Build and Release AniStudio

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: windows-x64
            artifact_name: AniStudio-Windows-x64
            cmake_arch: ""
            msvc_arch: "x64"
            cross: false

          - os: ubuntu-22.04
            variant: linux-x64
            artifact_name: AniStudio-Linux-x64
            cmake_arch: ""
            msvc_arch: ""
            cross: false

          - os: ubuntu-22.04
            variant: linux-arm64
            artifact_name: AniStudio-Linux-ARM64
            cmake_arch: "-DCMAKE_TOOLCHAIN_FILE=/tmp/aarch64-toolchain.cmake"
            msvc_arch: ""
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install ARM64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cat > /tmp/aarch64-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            ninja-build pkg-config build-essential

      - name: Setup MSVC env
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Restore Conan package cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-core-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-core-${{ runner.os }}-${{ matrix.variant }}-

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          if [ ! -f build/conan/conan_toolchain.cmake ]; then
            echo "::error::build/conan/conan_toolchain.cmake missing"
            ls -la build/ || true
            ls -la build/conan/ || true
            exit 1
          fi
          echo "Conan toolchain present"

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -B build -S . \
              -A x64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
              -DBUILD_SHARED_LIBS=ON -DBUILD_APP_MODE=local
          else
            cmake -B build -S . \
              -G Ninja ${{ matrix.cmake_arch }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
              -DBUILD_SHARED_LIBS=ON -DBUILD_APP_MODE=local
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/AniStudio"

          cp build/AniStudio "$APPDIR/usr/bin/"

          for so in $(find build -maxdepth 1 -name "*.so*"); do
            cp "$so" "$APPDIR/usr/lib/"
          done

          ldd build/AniStudio 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
            case "$dep" in
              /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
              *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
            esac
          done

          for so in "$APPDIR/usr/lib"/*.so*; do
            [ -f "$so" ] || continue
            ldd "$so" 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
              case "$dep" in
                /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
                *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
              esac
            done
          done

          cp -r build/data    "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/shaders "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/assets  "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true

          if [ -f assets/favicom.jpg ]; then
            convert assets/favicom.jpg "$APPDIR/AniStudio.png" || \
              cp assets/favicom.jpg "$APPDIR/AniStudio.png"
          fi

          cat > "$APPDIR/AniStudio.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AniStudio
          Exec=AniStudio
          Icon=AniStudio
          Categories=Graphics;AudioVideo;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/AniStudio" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          if [ "${{ matrix.variant }}" == "linux-arm64" ]; then
            TOOL_URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage"
            export ARCH=aarch64
          else
            TOOL_URL="https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            export ARCH=x86_64
          fi
          wget -q "$TOOL_URL" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "AniStudio-${{ steps.ver.outputs.hash }}-${{ matrix.variant }}.AppImage"

      - name: Upload AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.variant }}
          path: AniStudio-${{ steps.ver.outputs.hash }}-*.AppImage
          retention-days: 7

      - name: Package core
        shell: bash
        run: |
          mkdir -p artifact-bundle/lib artifact-bundle/bin
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp build/Release/AniStudio.exe artifact-bundle/ 2>/dev/null || cp build/AniStudio.exe artifact-bundle/ 2>/dev/null || true
            find build -name "*.dll" -exec cp {} artifact-bundle/ \; 2>/dev/null || true
            find build -name "*.dll" -exec cp {} artifact-bundle/bin/ \; 2>/dev/null || true
            find build -name "*.lib" -exec cp {} artifact-bundle/lib/ \; 2>/dev/null || true
          else
            cp build/AniStudio artifact-bundle/ 2>/dev/null || true
            find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/ \; 2>/dev/null || true
            find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/lib/ \; 2>/dev/null || true
            find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/bin/ \; 2>/dev/null || true
          fi
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C artifact-bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          retention-days: 7

  build-plugin:
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: windows-x64, runner: windows-latest, backend: CPU,     msvc_arch: "x64", rocm: false }
          - { variant: windows-x64, runner: windows-latest, backend: CUDA,    msvc_arch: "x64", rocm: false }
          - { variant: windows-x64, runner: windows-latest, backend: VULKAN,  msvc_arch: "x64", rocm: false }
          - { variant: windows-x64, runner: windows-latest, backend: OPENCL,  msvc_arch: "x64", rocm: false }
          - { variant: windows-x64, runner: windows-latest, backend: HIPBLAS, msvc_arch: "",    rocm: true  }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: CPU,     msvc_arch: "",    rocm: false }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: CUDA,    msvc_arch: "",    rocm: false }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: VULKAN,  msvc_arch: "",    rocm: false }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: OPENCL,  msvc_arch: "",    rocm: false }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: HIPBLAS, msvc_arch: "",    rocm: false }
          - { variant: linux-x64,   runner: ubuntu-22.04,  backend: SYCL,    msvc_arch: "",    rocm: false }
          - { variant: linux-arm64, runner: ubuntu-22.04,  backend: CPU,     msvc_arch: "",    rocm: false, cross: true }

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Map backend to target suffix
        id: suffix
        shell: bash
        run: |
          case "${{ matrix.backend }}" in
            CPU)     S="_CPU" ;;
            CUDA)    S="_CUDA" ;;
            VULKAN)  S="_VULKAN" ;;
            OPENCL)  S="_OPENCL" ;;
            HIPBLAS) S="_HIP" ;;
            SYCL)    S="_SYCL" ;;
            *) echo "unknown backend"; exit 1 ;;
          esac
          echo "suffix=$S" >> "$GITHUB_OUTPUT"
          echo "name=AniStudio-SDCPP$S" >> "$GITHUB_OUTPUT"

      - name: Install ARM64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cat > /tmp/aarch64-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            ninja-build pkg-config build-essential

      - name: Install CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.3.0'

      - name: Install Vulkan SDK (Linux)
        if: matrix.backend == 'VULKAN' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools

      - name: Install OpenCL (Linux)
        if: matrix.backend == 'OPENCL' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev opencl-headers

      - name: Install Intel oneAPI (SYCL)
        if: matrix.backend == 'SYCL'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

      - name: Install ROCm (Linux HipBLAS)
        if: matrix.backend == 'HIPBLAS' && runner.os == 'Linux'
        run: |
          wget https://repo.radeon.com/amdgpu-install/6.1/ubuntu/jammy/amdgpu-install_6.1.60100-1_all.deb
          sudo apt-get install -y ./amdgpu-install_6.1.60100-1_all.deb
          sudo amdgpu-install -y --usecase=hiplibsdk,rocm

      - name: Cache ROCm Installation (Windows)
        if: matrix.rocm && runner.os == 'Windows'
        id: cache-rocm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\AMD\ROCm
          key: rocm-6.4-windows-v1
          restore-keys: |
            rocm-6.4-windows-

      - name: Install AMD HIP SDK (Windows)
        if: matrix.rocm && runner.os == 'Windows' && steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-24.Q3-Win10-Win11-For-HIP.exe" -OutFile "${env:RUNNER_TEMP}\rocm-install.exe"
          $proc = Start-Process "${env:RUNNER_TEMP}\rocm-install.exe" -ArgumentList '-install' -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(600000)) { $proc.Kill(); exit 1 }
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

      - name: Configure ROCm Environment (Windows)
        if: matrix.rocm && runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Get-ChildItem 'C:\Program Files\AMD\ROCm\*\bin\clang.exe' | Select-Object -First 1
          if (-not $clang) { Write-Error "ROCm clang not found"; exit 1 }
          $bin = Split-Path $clang.FullName
          $root = Split-Path $bin
          echo "HIP_PATH=$root" >> $env:GITHUB_ENV
          echo "ROCM_PATH=$root" >> $env:GITHUB_ENV
          echo "CC=$($clang.FullName)" >> $env:GITHUB_ENV
          echo "CXX=$(Join-Path $bin 'clang++.exe')" >> $env:GITHUB_ENV
          echo "$bin" >> $env:GITHUB_PATH

      - name: Setup MSVC env
        if: runner.os == 'Windows' && !matrix.rocm
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Restore Conan package cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-plugin-${{ runner.os }}-${{ matrix.variant }}-${{ matrix.backend }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-plugin-${{ runner.os }}-${{ matrix.variant }}-${{ matrix.backend }}-

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          if [ ! -f build/conan/conan_toolchain.cmake ]; then
            echo "::error::build/conan/conan_toolchain.cmake missing"
            ls -la build/ || true
            ls -la build/conan/ || true
            exit 1
          fi
          echo "Conan toolchain present"

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-${{ matrix.variant }}
          path: core-build

      - name: Extract core
        shell: bash
        run: tar -xzf core-build/*.tar.gz -C core-build

      - name: Configure plugin (HIPBLAS Windows)
        if: matrix.backend == 'HIPBLAS' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$env:CC" `
            -DCMAKE_CXX_COMPILER="$env:CXX" `
            -DCMAKE_CXX_STANDARD=17 `
            -DMAIN_LIB_DIR="${{ github.workspace }}/core-build/lib" `
            -DMAIN_BIN_DIR="${{ github.workspace }}/core-build/bin" `
            -DSD_HIPBLAS=ON `
            -DAMDGPU_TARGETS="gfx1100;gfx1101;gfx1102;gfx1200;gfx1201" `
            -DGGML_OPENMP=OFF `
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Configure plugin (all other)
        if: matrix.backend != 'HIPBLAS' || runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            cmake -B plugin-build -S plugins/AniStudio-SDCPP \
              -A x64 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=17 \
              -DMAIN_LIB_DIR=${{ github.workspace }}/core-build/lib \
              -DMAIN_BIN_DIR=${{ github.workspace }}/core-build/bin \
              -DSD_${{ matrix.backend }}=ON \
              -DSD_USE_SYSTEM_GGML=OFF
          else
            cmake -B plugin-build -S plugins/AniStudio-SDCPP \
              -G Ninja ${{ matrix.cmake_arch }} \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_STANDARD=17 \
              -DMAIN_LIB_DIR=${{ github.workspace }}/core-build/lib \
              -DMAIN_BIN_DIR=${{ github.workspace }}/core-build/bin \
              -DSD_${{ matrix.backend }}=ON \
              -DSD_USE_SYSTEM_GGML=OFF
          fi

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="${{ steps.suffix.outputs.name }}"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-${{ matrix.variant }}.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ matrix.variant }}-${{ matrix.backend }}
          path: AniStudio-SDCPP-*.tar.gz
          retention-days: 7

  bundle-full:
    needs: [build-core, build-plugin]
    strategy:
      matrix:
        include:
          - { os: windows-latest, variant: windows-x64 }
          - { os: ubuntu-22.04,   variant: linux-x64 }
          - { os: ubuntu-22.04,   variant: linux-arm64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-${{ matrix.variant }}
          path: core

      - uses: actions/download-artifact@v4
        with:
          path: plugins
          pattern: Plugin-${{ matrix.variant }}-*

      - name: Assemble bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full
          mkdir -p full/plugins
          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            tar -xzf "$plugin_tar" -C full/plugins
          done
          tar -czf AniStudio-Full-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Full-${{ matrix.variant }}
          path: AniStudio-Full-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 7

  create-release:
    needs: [build-core, build-plugin, bundle-full]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: |
          find artifacts -type f -name "*.tar.gz" | sort
          find artifacts -type f -name "*.AppImage" | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.hash }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
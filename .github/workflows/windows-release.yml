name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_SHARED_LIBS=ON -DBUILD_APP_MODE=local

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package core
        shell: bash
        run: |
          mkdir -p artifact-bundle/lib artifact-bundle/bin
          cp build/Release/AniStudio.exe artifact-bundle/ 2>/dev/null || cp build/AniStudio.exe artifact-bundle/ 2>/dev/null || true
          find build -name "*.dll" -exec cp {} artifact-bundle/ \; 2>/dev/null || true
          find build -name "*.dll" -exec cp {} artifact-bundle/bin/ \; 2>/dev/null || true
          find build -name "*.lib" -exec cp {} artifact-bundle/lib/ \; 2>/dev/null || true
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          cp build/README.md              artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-LGPL-3.0.txt   artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-COMMERCIAL.txt artifact-bundle/ 2>/dev/null || true
          tar -czf AniStudio-Windows-x64.tar.gz -C artifact-bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: AniStudio-Windows-x64.tar.gz
          retention-days: 7

  build-plugins-windows:
    needs: build-core-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: CPU,    msvc_arch: "x64" }
          - { backend: CUDA,   msvc_arch: "x64" }
          - { backend: VULKAN, msvc_arch: "x64" }

    # Pinned (not windows-latest): CUDA 12.8's nvcc/cudafe++ is not compatible
    # with the VS 2026 toolset that windows-latest now ships. VS2022 (v143)
    # is the supported combo for CUDA 12.8.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Map backend to target suffix
        id: suffix
        shell: bash
        run: |
          case "${{ matrix.backend }}" in
            CPU)     S="_CPU" ;;
            CUDA)    S="_CUDA" ;;
            VULKAN)  S="_VULKAN" ;;
            *) echo "unknown backend"; exit 1 ;;
          esac
          echo "suffix=$S" >> "$GITHUB_OUTPUT"
          echo "name=AniStudio-SDCPP$S" >> "$GITHUB_OUTPUT"

      - name: Install CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "cufft", "cufft_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "nvrtc", "nvrtc_dev", "thrust", "visual_studio_integration"]'

      - name: Install Vulkan SDK
        if: matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $VULKAN_VERSION = "1.4.328.1"
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/windows/vulkansdk-windows-X64-$VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$VULKAN_VERSION\bin"

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: windows-${{ matrix.backend }}-x64
          evict-old-files: 1d

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core-build

      - name: Extract core
        shell: bash
        run: tar -xzf core-build/*.tar.gz -C core-build

      - name: Configure plugin (CUDA)
        if: matrix.backend == 'CUDA'
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -T "cuda=$CUDA_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" \
            -DMAIN_LIB_DIR=$GITHUB_WORKSPACE/core-build/lib \
            -DMAIN_BIN_DIR=$GITHUB_WORKSPACE/core-build/bin \
            -DSD_CUDA=ON \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Configure plugin (CPU/Vulkan)
        if: matrix.backend != 'CUDA'
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=$GITHUB_WORKSPACE/core-build/lib \
            -DMAIN_BIN_DIR=$GITHUB_WORKSPACE/core-build/bin \
            -DSD_${{ matrix.backend }}=ON \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="${{ steps.suffix.outputs.name }}"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-${{ matrix.backend }}
          path: AniStudio-SDCPP-*.tar.gz
          retention-days: 7

  build-plugin-hip-windows:
    needs: build-core-windows
    runs-on: windows-2022

    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ROCm Installation
        id: cache-rocm
        uses: actions/cache@v4
        with:
          path: C:\TheRock\build
          key: rocm-wheels-${{ env.ROCM_VERSION }}-${{ runner.os }}

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: windows-rocm-${{ env.ROCM_VERSION }}-x64
          evict-old-files: 1d

      - name: Install ROCm with Wheels
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{env.ROCM_VERSION}}"
          rocm-sdk init

      - name: Setup ROCm Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          rocm-sdk init
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Strip VS-only generator settings from Conan toolchain
        shell: bash
        run: |
          # This build uses -G Ninja, but Conan's CMakeToolchain still writes
          # CMAKE_GENERATOR_PLATFORM / _TOOLSET / _INSTANCE (Visual-Studio-only
          # settings) into conan_toolchain.cmake. Once those cache variables
          # exist at all, CMake's try_compile() unconditionally forwards them
          # to every scratch sub-build it runs (this is built into CMake and
          # can't be turned off via a conf flag) - which is what breaks
          # pybind11's compiler-flag checks under Ninja ("Generator Ninja does
          # not support platform specification"). Removing the lines outright
          # is the only reliable fix.
          sed -i \
            -e '/CMAKE_GENERATOR_PLATFORM/d' \
            -e '/CMAKE_GENERATOR_TOOLSET/d' \
            -e '/CMAKE_GENERATOR_INSTANCE/d' \
            build/conan/conan_toolchain.cmake
          echo "Remaining CMAKE_GENERATOR references (should be none):"
          grep -n "CMAKE_GENERATOR" build/conan/conan_toolchain.cmake || echo "  (none)"

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core-build

      - name: Extract core
        shell: bash
        run: tar -xzf core-build/*.tar.gz -C core-build

      - name: Configure plugin (HIPBLAS Windows)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "Platform="
          cmake -B plugin-build -S plugins/AniStudio-SDCPP ^
            -G "Ninja" ^
            -DCMAKE_C_COMPILER="%HIP_PATH%\lib\llvm\bin\clang.exe" ^
            -DCMAKE_CXX_COMPILER="%HIP_PATH%\lib\llvm\bin\clang++.exe" ^
            -DCMAKE_HIP_COMPILER="%HIP_PATH%\lib\llvm\bin\clang.exe" ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DMAIN_LIB_DIR="%GITHUB_WORKSPACE%/core-build/lib" ^
            -DMAIN_BIN_DIR="%GITHUB_WORKSPACE%/core-build/bin" ^
            -DSD_HIPBLAS=ON ^
            -DHIP_PATH="%HIP_PATH%" ^
            -DGPU_TARGETS="%GPU_TARGETS%" ^
            -DGGML_OPENMP=OFF ^
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-HIPBLAS
          path: AniStudio-SDCPP-*.tar.gz
          retention-days: 7

  bundle-windows:
    needs: [build-core-windows, build-plugins-windows, build-plugin-hip-windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core

      - uses: actions/download-artifact@v4
        with:
          path: plugins
          pattern: Plugin-windows-x64-*

      - name: Assemble bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full
          mkdir -p full/plugins
          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            tar -xzf "$plugin_tar" -C full/plugins
          done
          tar -czf AniStudio-Full-windows-x64-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Full-windows-x64
          path: AniStudio-Full-windows-x64-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 7

  release-windows:
    needs: [build-core-windows, build-plugins-windows, build-plugin-hip-windows, bundle-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${HASH}-windows"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: |
          find artifacts -type f -name "*.tar.gz" | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.hash }}-windows
          tag_name: ${{ steps.ver.outputs.hash }}-windows
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
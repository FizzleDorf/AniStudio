name: Release Linux Intel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-plugin-sycl-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Linux run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'linux-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Linux run found. Run linux-release.yml first.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify and extract core
        shell: bash
        run: |
          ls -la core-build
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/libAniEngineCore.so || test -f core-extracted/lib/AniEngineCore.so || {
            echo "::error::AniEngineCore.so missing"
            exit 1
          }
          test -f core-extracted/lib/libAniStudioCore.so || test -f core-extracted/lib/AniStudioCore.so || {
            echo "::error::AniStudioCore.so missing"
            exit 1
          }

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libgtk-3-dev \
            ninja-build pkg-config build-essential

      - name: Install Intel oneAPI (SYCL)
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ubuntu-sycl-x64
          evict-old-files: 1d

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Configure plugin (SYCL Linux)
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=$GITHUB_WORKSPACE/core-extracted/lib \
            -DMAIN_BIN_DIR=$GITHUB_WORKSPACE/core-extracted/bin \
            -DSD_SYCL=ON \
            -DGGML_SYCL_F16=ON \
            -DGGML_SYCL_DNN=ON \
            -DGGML_OPENMP=OFF \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_SYCL"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .
          tar -tzf "${PLUGIN_NAME}-linux-x64.tar.gz" | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-SYCL
          path: AniStudio-SDCPP_*.tar.gz
          retention-days: 90

  bundle-intel-linux:
    needs: build-plugin-sycl-linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Linux run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'linux-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Linux run found.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-CPU
          path: plugins/CPU
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-VULKAN
          path: plugins/VULKAN
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-SYCL
          path: plugins/SYCL

      - name: Verify plugin inputs
        shell: bash
        run: |
          find core plugins -type f -name "*.tar.gz" | sort
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins/CPU/*.tar.gz || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins/VULKAN/*.tar.gz || { echo "::error::Vulkan plugin tarball missing"; exit 1; }
          test -f plugins/SYCL/*.tar.gz || { echo "::error::SYCL plugin tarball missing"; exit 1; }

      - name: Assemble Intel bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full
          mkdir -p full/plugins
          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            tar -xzf "$plugin_tar" -C full/plugins
          done
          find full/plugins -maxdepth 3 -type f | sort
          tar -czf AniStudio-Intel-Bundle-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Intel-Bundle-linux-x64
          path: AniStudio-Intel-Bundle-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 90

  release-intel-linux:
    needs: [build-plugin-sycl-linux, bundle-intel-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-SYCL
          path: sycl-plugin

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Intel-Bundle-linux-x64
          path: intel-bundle

      - name: Verify artifacts
        shell: bash
        run: |
          find sycl-plugin intel-bundle -type f -name "*.tar.gz" | sort
          test -f sycl-plugin/*.tar.gz || { echo "::error::SYCL plugin tarball missing"; exit 1; }
          test -f intel-bundle/*.tar.gz || { echo "::error::Intel bundle tarball missing"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: AniStudio ${{ steps.ver.outputs.hash }}
          tag_name: ${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: |
            sycl-plugin/**/*.tar.gz
            intel-bundle/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
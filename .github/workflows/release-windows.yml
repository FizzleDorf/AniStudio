name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  core:
    runs-on: windows-latest
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2
            build/venv
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Install Conan dependencies
        shell: cmd
        run: install.bat

      - name: Run Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          build.bat --local --jobs 8

      - name: Verify libs and DLLs exist
        shell: bash
        run: |
          test -f build/lib/AniEngineCore.lib || { echo "::error::AniEngineCore.lib missing"; exit 1; }
          test -f build/lib/AniStudioCore.lib || { echo "::error::AniStudioCore.lib missing"; exit 1; }
          test -f build/AniEngineCore.dll || { echo "::error::AniEngineCore.dll missing"; exit 1; }
          test -f build/AniStudioCore.dll || { echo "::error::AniStudioCore.dll missing"; exit 1; }
          test -f build/AniStudio.exe || { echo "::error::AniStudio.exe missing"; exit 1; }

      - name: Package core and build env
        shell: bash
        run: |
          rm -rf artifact-bundle
          mkdir -p artifact-bundle/lib
          
          cp build/AniStudio.exe artifact-bundle/
          cp build/*.dll artifact-bundle/
          cp -a build/lib/. artifact-bundle/lib/
          
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          
          tar -czf AniStudio-Windows-x64.tar.gz -C artifact-bundle .
          (cd artifact-bundle && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Windows-x64.zip -Force")

          tar -czf build-env.tar.gz build

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: |
            AniStudio-Windows-x64.tar.gz
            AniStudio-Windows-x64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: build-env.tar.gz
          retention-days: 30

      - name: Publish core release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-Windows-x64.tar.gz
            AniStudio-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-cpu:
    needs: core
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: .

      - name: Extract Build Env
        shell: bash
        run: tar -xzf build-env.tar.gz

      - name: Run Plugin Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          build (1).bat

      - name: Package plugin (tar.gz + zip)
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CPU"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          (cd pkg && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../${PLUGIN_NAME}-windows-x64.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-CPU
          path: |
            AniStudio-SDCPP_CPU-windows-x64.tar.gz
            AniStudio-SDCPP_CPU-windows-x64.zip
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-SDCPP_CPU-windows-x64.tar.gz
            AniStudio-SDCPP_CPU-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-vulkan:
    needs: core
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: .

      - name: Extract Build Env
        shell: bash
        run: tar -xzf build-env.tar.gz

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $VULKAN_VERSION = "1.4.328.1"
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/windows/vulkansdk-windows-X64-$VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$VULKAN_VERSION\bin"

      - name: Run Plugin Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          build (1).bat --vulkan

      - name: Package plugin (tar.gz + zip)
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_VULKAN"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          (cd pkg && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../${PLUGIN_NAME}-windows-x64.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-VULKAN
          path: |
            AniStudio-SDCPP_VULKAN-windows-x64.tar.gz
            AniStudio-SDCPP_VULKAN-windows-x64.zip
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-SDCPP_VULKAN-windows-x64.tar.gz
            AniStudio-SDCPP_VULKAN-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-cuda:
    needs: core
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: .

      - name: Extract Build Env
        shell: bash
        run: tar -xzf build-env.tar.gz

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "cufft", "cufft_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev", "nvrtc", "nvrtc_dev", "thrust", "visual_studio_integration"]'

      - name: Run Plugin Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          build (1).bat --cuda

      - name: Package plugin (tar.gz + zip)
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CUDA"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          (cd pkg && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../${PLUGIN_NAME}-windows-x64.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-CUDA
          path: |
            AniStudio-SDCPP_CUDA-windows-x64.tar.gz
            AniStudio-SDCPP_CUDA-windows-x64.zip
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-SDCPP_CUDA-windows-x64.tar.gz
            AniStudio-SDCPP_CUDA-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-hip:
    needs: core
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 300
    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: .

      - name: Extract Build Env
        shell: bash
        run: tar -xzf build-env.tar.gz

      - name: Cache ROCm Installation
        id: cache-rocm
        uses: actions/cache@v4
        with:
          path: C:\TheRock\build
          key: rocm-wheels-${{ env.ROCM_VERSION }}-${{ runner.os }}

      - name: Install ROCm with Wheels
        if: steps.cache-rocm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{ env.ROCM_VERSION }}"
          rocm-sdk init

      - name: Setup ROCm Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          rocm-sdk init
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Run Plugin Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          build (1).bat --hipblas

      - name: Package plugin (tar.gz + zip)
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          (cd pkg && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../${PLUGIN_NAME}-windows-x64.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-HIPBLAS
          path: |
            AniStudio-SDCPP_HIP-windows-x64.tar.gz
            AniStudio-SDCPP_HIP-windows-x64.zip
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-SDCPP_HIP-windows-x64.tar.gz
            AniStudio-SDCPP_HIP-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-sycl:
    needs: core
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Windows
          path: .

      - name: Extract Build Env
        shell: bash
        run: tar -xzf build-env.tar.gz

      - name: Setup Intel oneAPI
        uses: ./.github/actions/setup-oneapi
        with:
          version: "2025.3.2.0"
          installer-url: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/f3c8bf4b-3e1e-4c7a-83e5-6c4a7e1a2f7d/w_Intel_oneAPI_BaseKit_2025.3.2.0_offline.exe"

      - name: Run Plugin Build Script
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          build (1).bat --sycl

      - name: Package plugin (tar.gz + zip)
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_SYCL"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/

          declare -A seen
          copy_dlls() {
            local src="$1"; [ -d "$src" ] || return 0
            while IFS= read -r dll; do
              base="$(basename "$dll")"
              if [ -z "${seen[$base]:-}" ]; then cp "$dll" pkg/; seen[$base]=1; fi
            done < <(find "$src" -maxdepth 2 -iname "*.dll" 2>/dev/null | sort)
          }
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin/compiler"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/mkl/latest/redist/intel64"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/tbb/latest/redist/intel64/vc_mt"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/level_zero/latest/bin"
          if [ -f "C:/Program Files (x86)/Intel/oneAPI/licensing/license.txt" ]; then
            cp "C:/Program Files (x86)/Intel/oneAPI/licensing/license.txt" pkg/INTEL-LICENSE.txt
          fi

          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          (cd pkg && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../${PLUGIN_NAME}-windows-x64.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-SYCL
          path: |
            AniStudio-SDCPP_SYCL-windows-x64.tar.gz
            AniStudio-SDCPP_SYCL-windows-x64.zip
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-SDCPP_SYCL-windows-x64.tar.gz
            AniStudio-SDCPP_SYCL-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle:
    needs: [core, plugin-cpu, plugin-vulkan, plugin-cuda, plugin-hip, plugin-sycl]
    if: always()
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core

      - name: Download available plugin artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Plugin-windows-x64-*
          path: plugins
          merge-multiple: false

      - name: Normalize plugin artifact layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins-normalized
          mkdir -p plugins-normalized/CPU plugins-normalized/VULKAN plugins-normalized/CUDA plugins-normalized/HIP plugins-normalized/SYCL
          [ -d plugins/Plugin-windows-x64-CPU ]     && cp -f plugins/Plugin-windows-x64-CPU/*     plugins-normalized/CPU/    || true
          [ -d plugins/Plugin-windows-x64-VULKAN ]  && cp -f plugins/Plugin-windows-x64-VULKAN/*  plugins-normalized/VULKAN/ || true
          [ -d plugins/Plugin-windows-x64-CUDA ]    && cp -f plugins/Plugin-windows-x64-CUDA/*    plugins-normalized/CUDA/   || true
          [ -d plugins/Plugin-windows-x64-HIPBLAS ] && cp -f plugins/Plugin-windows-x64-HIPBLAS/* plugins-normalized/HIP/    || true
          [ -d plugins/Plugin-windows-x64-SYCL ]    && cp -f plugins/Plugin-windows-x64-SYCL/*    plugins-normalized/SYCL/   || true

      - name: Verify required artifacts
        shell: bash
        run: |
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins-normalized/CPU/*.tar.gz    || { echo "::warning::CPU plugin tarball missing"; }

      - name: Assemble Nvidia bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-nvidia"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          if ls plugins-normalized/CPU/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CPU/*.tar.gz -C "$STAGE/plugins"; fi
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/CUDA/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CUDA/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::CUDA unavailable"; fi
          tar -czf "AniStudio-Nvidia-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Nvidia-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - name: Assemble AMD bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-amd"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          if ls plugins-normalized/CPU/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CPU/*.tar.gz -C "$STAGE/plugins"; fi
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/HIP/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/HIP/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::HIP unavailable"; fi
          tar -czf "AniStudio-AMD-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-AMD-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - name: Assemble Intel bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-intel"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          if ls plugins-normalized/CPU/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CPU/*.tar.gz -C "$STAGE/plugins"; fi
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/SYCL/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/SYCL/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::SYCL unavailable"; fi
          tar -czf "AniStudio-Intel-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Intel-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Windows-Bundles
          path: |
            AniStudio-*-Bundle-windows-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Publish bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            AniStudio-*-Bundle-windows-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
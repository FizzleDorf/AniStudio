name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  core-linux:
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Cache Conan (Linux)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: conan-Linux-v1
          restore-keys: conan-Linux-

      - name: Install Conan deps
        run: ./install.sh

      - name: Build Core
        run: |
          source build/venv/bin/activate
          ./build.sh --local --jobs $(nproc)

      - name: Package Core
        run: |
          mkdir -p pkg-linux-core/lib pkg-linux-core/bin
          cp build/AniStudio pkg-linux-core/
          cp -a build/lib/. pkg-linux-core/lib/
          cp -a build/bin/. pkg-linux-core/bin/ 2>/dev/null || true
          cp -r build/data pkg-linux-core/ 2>/dev/null || true
          cp -r build/shaders pkg-linux-core/ 2>/dev/null || true
          cp -r build/assets pkg-linux-core/ 2>/dev/null || true
          tar -czf AniStudio-Linux-x64.tar.gz -C pkg-linux-core .
          tar -czf build-env-linux.tar.gz --exclude='build/conan' --exclude='build/venv' build

      - uses: actions/upload-artifact@v4
        with: { name: Core-Linux, path: AniStudio-Linux-x64.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: BuildEnv-Linux, path: build-env-linux.tar.gz }

  core-windows:
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git wget zip \
            mingw-w64 g++-mingw-w64-x86-64 libgl1-mesa-dev libglu1-mesa-dev

      - name: Cache Conan (Windows)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: conan-Windows-v1
          restore-keys: conan-Windows-

      - name: Setup MinGW & Conan
        run: |
          python3 -m venv build/venv
          source build/venv/bin/activate
          pip install conan
          conan profile detect --force
          conan profile new win-cross --detect --force
          conan profile update settings.os=Windows win-cross
          conan profile update settings.arch=x86_64 win-cross
          conan profile update settings.compiler=gcc win-cross
          conan profile update settings.compiler.version=11 win-cross
          conan profile update settings.compiler.libcxx=libstdc++11 win-cross
          conan profile update conf.tools.cmake.cmaketoolchain:system_name=Windows win-cross

      - name: Install Conan deps (Windows)
        run: |
          source build/venv/bin/activate
          conan install . --build=missing -pr:h win-cross -pr:b default -s compiler.cppstd=17

      - name: Build Core (Windows)
        run: |
          mkdir -p build-win
          cd build-win
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../build/conan/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build . --config Release --parallel $(nproc)

      - name: Package Core
        run: |
          mkdir -p pkg-win-core/lib
          cp build-win/AniStudio.exe pkg-win-core/ 2>/dev/null || cp build-win/*.exe pkg-win-core/ 2>/dev/null || true
          cp build-win/*.dll pkg-win-core/ 2>/dev/null || true
          cp -a build-win/lib/. pkg-win-core/lib/ 2>/dev/null || true
          cp -r build-win/data pkg-win-core/ 2>/dev/null || true
          cp -r build-win/shaders pkg-win-core/ 2>/dev/null || true
          cp -r build-win/assets pkg-win-core/ 2>/dev/null || true
          (cd pkg-win-core && zip -r ../AniStudio-Windows-x64.zip .)
          tar -czf build-env-win.tar.gz --exclude='build/conan' --exclude='build/venv' build

      - uses: actions/upload-artifact@v4
        with: { name: Core-Windows, path: AniStudio-Windows-x64.zip }
      - uses: actions/upload-artifact@v4
        with: { name: BuildEnv-Windows, path: build-env-win.tar.gz }

  plugin-linux:
    needs: core-linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP, SYCL]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }
      
      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            libpulse-dev libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then sudo apt-get install -y libvulkan-dev glslc spirv-headers; fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then
            wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
            echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
            sudo apt-get update && sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel intel-oneapi-tbb-devel
          fi

      - name: Setup CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "curand", "curand_dev"]'

      - name: Setup HIP
        if: matrix.backend == 'HIP'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==6.4.0"
          echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)" >> $GITHUB_ENV
          echo "$(rocm-sdk path --bin)" >> $GITHUB_PATH

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: conan-Linux-v1
          restore-keys: conan-Linux-

      - name: Install Conan
        run: ./install.sh

      - uses: actions/download-artifact@v4
        with: { name: BuildEnv-Linux, path: . }
      - run: tar -xzf build-env-linux.tar.gz

      - name: Build Plugin
        run: |
          source build/venv/bin/activate
          cd plugins/AniStudio-SDCPP
          chmod +x build.sh
          FLAG=""
          if [ "${{ matrix.backend }}" != "CPU" ]; then FLAG="--$(echo ${{ matrix.backend }} | tr '[:upper:]' '[:lower:]')"; fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then source /opt/intel/oneapi/setvars.sh; fi
          ./build.sh $FLAG

      - name: Package Plugin
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C "build/plugins/${PLUGIN_NAME}" .

      - uses: actions/upload-artifact@v4
        with: { name: Plugin-Linux-${{ matrix.backend }}, path: AniStudio-SDCPP_${{ matrix.backend }}-linux-x64.tar.gz }

  plugin-windows:
    needs: core-windows
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, SYCL]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }
      
      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git wget zip \
            mingw-w64 g++-mingw-w64-x86-64
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then sudo apt-get install -y libvulkan-dev glslc spirv-headers; fi

      - name: Cache Conan (Windows)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: conan-Windows-v1
          restore-keys: conan-Windows-

      - name: Setup MinGW & Conan
        run: |
          python3 -m venv build/venv
          source build/venv/bin/activate
          pip install conan
          conan profile detect --force
          conan profile new win-cross --detect --force
          conan profile update settings.os=Windows win-cross
          conan profile update settings.arch=x86_64 win-cross
          conan profile update settings.compiler=gcc win-cross
          conan profile update settings.compiler.version=11 win-cross
          conan profile update settings.compiler.libcxx=libstdc++11 win-cross
          conan profile update conf.tools.cmake.cmaketoolchain:system_name=Windows win-cross

      - name: Install Conan
        run: |
          source build/venv/bin/activate
          conan install . --build=missing -pr:h win-cross -pr:b default -s compiler.cppstd=17

      - uses: actions/download-artifact@v4
        with: { name: BuildEnv-Windows, path: . }
      - run: tar -xzf build-env-win.tar.gz

      - name: Build Plugin
        run: |
          source build/venv/bin/activate
          cd plugins/AniStudio-SDCPP
          
          CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=../../build/conan/conan_toolchain.cmake -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=OFF"
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_VULKAN=ON"; fi
          if [ "${{ matrix.backend }}" = "CUDA" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_CUDA=ON"; fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_SYCL=ON"; fi
          
          cmake -B build-win -G Ninja $CMAKE_ARGS
          cmake --build build-win --config Release || echo "::warning::Windows ${{ matrix.backend }} failed"

      - name: Package Plugin
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          if [ -d "build/plugins/${PLUGIN_NAME}" ]; then
            (cd "build/plugins/${PLUGIN_NAME}" && zip -r ../../../../"${PLUGIN_NAME}-windows-x64.zip" .)
            mv "${PLUGIN_NAME}-windows-x64.zip" ../../ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with: 
          name: Plugin-Windows-${{ matrix.backend }}
          path: AniStudio-SDCPP_${{ matrix.backend }}-windows-x64.zip
          if-no-files-found: warn

  bundle:
    needs: [core-linux, core-windows, plugin-linux, plugin-windows]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      
      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble Bundles
        run: |
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          
          for VENDOR in Nvidia AMD Intel; do
            STAGE="stage-linux-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            tar -xzf artifacts/AniStudio-Linux-x64.tar.gz -C "$STAGE"
            if [ -f "artifacts/AniStudio-SDCPP_CPU-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_CPU-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ -f "artifacts/AniStudio-SDCPP_VULKAN-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_VULKAN-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Nvidia" ] && [ -f "artifacts/AniStudio-SDCPP_CUDA-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_CUDA-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "AMD" ] && [ -f "artifacts/AniStudio-SDCPP_HIP-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_HIP-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Intel" ] && [ -f "artifacts/AniStudio-SDCPP_SYCL-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_SYCL-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            tar -czf "AniStudio-${VENDOR}-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          done

          for VENDOR in Nvidia Intel; do
            STAGE="stage-win-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            unzip -q artifacts/AniStudio-Windows-x64.zip -d "$STAGE"
            if [ -f "artifacts/AniStudio-SDCPP_CPU-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_CPU-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ -f "artifacts/AniStudio-SDCPP_VULKAN-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_VULKAN-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Nvidia" ] && [ -f "artifacts/AniStudio-SDCPP_CUDA-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_CUDA-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Intel" ] && [ -f "artifacts/AniStudio-SDCPP_SYCL-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_SYCL-windows-x64.zip -d "$STAGE/plugins"; fi
            (cd "$STAGE" && zip -r "../AniStudio-${VENDOR}-Bundle-windows-x64-${SHORT_HASH}.zip" .)
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            artifacts/AniStudio-Linux-x64.tar.gz
            artifacts/AniStudio-Windows-x64.zip
            artifacts/AniStudio-SDCPP_*-linux-x64.tar.gz
            artifacts/AniStudio-SDCPP_*-windows-x64.zip
            AniStudio-*-Bundle-linux-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
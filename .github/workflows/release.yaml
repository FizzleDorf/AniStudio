name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2
  # Plugin CMake default is 75;80;86;89;90 - 120 added so RTX 50-series works. Remove it to shorten the build.
  CUDA_ARCHS: "75;80;86;89;90;120"
  HIP_ARCHS: "gfx1030;gfx1031;gfx1032;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1200;gfx1201"
  # Never build release binaries with -march=native on a CI runner
  CPU_FLAGS: "-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
  LINUX_DEPS: >-
    imagemagick libva-dev libgl1-mesa-dev libglu1-mesa-dev
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev
    libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config
    build-essential python3-dev patchelf

jobs:
  # =====================================================================
  # LINUX CORE
  # =====================================================================
  core-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        run: git submodule update --init --force --recursive

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Linux-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan-Linux-

      - name: Install Conan + dependencies
        run: ./install.sh

      # Root build.sh does not accept --local/--jobs, so configure the root CMakeLists directly.
      # Root CMake expects -B build (conan toolchain lives in build/conan).
      - name: Build Core
        run: |
          set -euo pipefail
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          test -f build/AniStudio
          test -f build/lib/AniEngineCore.so || test -f build/lib/libAniEngineCore.so
          test -f build/lib/AniStudioCore.so || test -f build/lib/libAniStudioCore.so

      - name: Package Core
        run: |
          set -euo pipefail
          rm -rf pkg-linux-core && mkdir -p pkg-linux-core/lib
          cp build/AniStudio pkg-linux-core/
          cp -a build/lib/*.so* pkg-linux-core/lib/

          # ffmpeg / glfw / portaudio are shared Conan packages: pull every Conan .so the
          # binaries resolve to into lib/ so the package runs without the Conan cache.
          for f in build/AniStudio build/lib/*.so; do ldd "$f" 2>/dev/null || true; done \
            | awk '/=> \//{print $3}' | sort -u | grep -F "$CONAN_HOME" \
            | while read -r lib; do cp -nL "$lib" pkg-linux-core/lib/; done

          patchelf --set-rpath '$ORIGIN/lib' pkg-linux-core/AniStudio
          for so in pkg-linux-core/lib/*.so*; do
            [ -L "$so" ] || patchelf --set-rpath '$ORIGIN' "$so"
          done

          if ldd pkg-linux-core/AniStudio | grep "not found"; then
            echo "::warning::Unresolved shared libraries in packaged AniStudio (see log above)"
          fi

          for d in data shaders shader assets scripts docs; do
            [ -d "build/$d" ] && cp -r "build/$d" pkg-linux-core/ || true
          done
          cp -f build/README.md build/LICENSE-*.txt pkg-linux-core/ 2>/dev/null || true

          tar -czf AniStudio-Linux-x64.tar.gz -C pkg-linux-core .

          # Only what plugin builds link against
          mkdir -p build/bin
          tar -czf build-env-linux.tar.gz build/lib build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: Core-Linux
          path: AniStudio-Linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BuildEnv-Linux
          path: build-env-linux.tar.gz
          if-no-files-found: error
          retention-days: 1

  # =====================================================================
  # LINUX PLUGINS
  # =====================================================================
  plugin-linux:
    needs: core-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP, SYCL]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        run: git submodule update --init --force --recursive

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS cmake git wget
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then
            sudo apt-get install -y libvulkan-dev glslc spirv-headers
          fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then
            wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
            echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
            sudo apt-get update
            sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel intel-oneapi-tbb-devel
          fi

      - name: Setup CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.8.1'
          method: 'network'

      - name: Setup HIP
        if: matrix.backend == 'HIP'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==10.1.0"
          echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)" >> "$GITHUB_ENV"
          echo "$(rocm-sdk path --bin)" >> "$GITHUB_PATH"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Restore only: the core job owns saving. Fail fast instead of rebuilding ffmpeg 8 times.
      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Linux-${{ hashFiles('**/conanfile.*') }}
          fail-on-cache-miss: true

      - name: Install Conan + dependencies
        run: ./install.sh

      - uses: actions/download-artifact@v4
        with:
          name: BuildEnv-Linux
          path: .
      - run: tar -xzf build-env-linux.tar.gz

      # Mirrors plugins/AniStudio-SDCPP/build.sh: build dir and staging dir are
      # build/plugins/<TARGET>/{build,staging}
      - name: Build Plugin
        run: |
          set -euo pipefail
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          BUILD_DIR="build/plugins/$NAME/build"
          read -ra CPUF <<< "$CPU_FLAGS"
          ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON "${CPUF[@]}")

          case "${{ matrix.backend }}" in
            VULKAN) ARGS+=(-DSD_VULKAN=ON) ;;
            CUDA)   ARGS+=(-DSD_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHS") ;;
            HIP)
              ROCM_ROOT="$(dirname "$(rocm-sdk path --bin)")"
              CLANGXX="$( (find "$ROCM_ROOT" \( -type f -o -type l \) -name clang++ 2>/dev/null || true) | head -1 )"
              CLANG="$( (find "$ROCM_ROOT" \( -type f -o -type l \) -name clang 2>/dev/null || true) | head -1 )"
              [ -n "$CLANGXX" ] || { CLANGXX=clang++; CLANG=clang; }
              echo "Using $CLANGXX"
              ARGS+=(-DSD_HIPBLAS=ON "-DCMAKE_C_COMPILER=$CLANG" "-DCMAKE_CXX_COMPILER=$CLANGXX"
                     "-DAMDGPU_TARGETS=$HIP_ARCHS" "-DGPU_TARGETS=$HIP_ARCHS" -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON) ;;
            SYCL)
              source /opt/intel/oneapi/setvars.sh --force
              ARGS+=(-DSD_SYCL=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx) ;;
          esac

          cmake -S plugins/AniStudio-SDCPP -B "$BUILD_DIR" "${ARGS[@]}"
          cmake --build "$BUILD_DIR" --config Release --target "$NAME" --parallel "$(nproc)"
          test -f "build/plugins/$NAME/staging/$NAME.so"

      # Runtime layout (PluginManager): plugins/<NAME>/staging/<NAME>.so
      - name: Package Plugin
        run: |
          set -euo pipefail
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          rm -rf pkg && mkdir -p "pkg/$NAME/staging"
          cp "build/plugins/$NAME/staging/$NAME.so" "pkg/$NAME/staging/"
          tar -czf "$NAME-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-Linux-${{ matrix.backend }}
          path: AniStudio-SDCPP_${{ matrix.backend }}-linux-x64.tar.gz
          if-no-files-found: error

  # =====================================================================
  # WINDOWS CORE
  # =====================================================================
  core-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        shell: bash
        run: git submodule update --init --force --recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('**/conanfile.*') }}
          restore-keys: conan-Windows-

      # "< nul" stops the trailing `pause` in install.bat from waiting on input
      - name: Install Conan + dependencies
        shell: cmd
        run: call install.bat < nul

      # conanfile.py targets Visual Studio 17 2022 and the root CMake only puts the
      # core DLLs next to the exe with a multi-config generator, so don't use Ninja here.
      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
          test -f build/lib/AniEngineCore.lib
          test -f build/lib/AniStudioCore.lib

      # Collect every shared lib of every Conan dependency (including transitive ones),
      # so the package does not depend on the post-build copy list in the root CMakeLists.
      - name: Collect Conan runtime DLLs
        shell: bash
        run: |
          set -euo pipefail
          source build/venv/Scripts/activate
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release \
            --deployer=runtime_deploy --deployer-folder=build/runtime-deploy
          echo "Deployed runtime DLLs:"
          find build/runtime-deploy -name '*.dll' -exec basename {} \; | sort

      - name: Package Core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pkg-win-core && mkdir -p pkg-win-core
          EXE="$(find build -maxdepth 2 -name AniStudio.exe | head -1)"
          [ -n "$EXE" ] || { echo "::error::AniStudio.exe not found"; exit 1; }
          cp "$EXE" pkg-win-core/

          find build -maxdepth 2 -name '*.dll' \
            -not -path 'build/conan/*' -not -path 'build/venv/*' -not -path 'build/plugins/*' \
            -exec cp -n {} pkg-win-core/ \;

          # All Conan runtime DLLs go next to the exe (flat)
          find build/runtime-deploy -name '*.dll' -exec cp -n {} pkg-win-core/ \;

          for dll in AniEngineCore.dll AniStudioCore.dll; do
            [ -f "pkg-win-core/$dll" ] || { echo "::error::$dll missing from package"; exit 1; }
          done

          for d in data shaders shader assets scripts docs; do
            [ -d "build/$d" ] && cp -r "build/$d" pkg-win-core/ || true
          done
          cp -f build/README.md build/LICENSE-*.txt pkg-win-core/ 2>/dev/null || true

          # Fail the build if the exe or any packaged DLL imports a DLL that is neither in the
          # package nor a Windows system DLL (this is what "app won't start" looks like).
          cd pkg-win-core
          shopt -s nullglob
          declare -A HAVE
          for f in *; do HAVE["${f,,}"]=1; done
          MISSING=0
          for f in *.exe *.dll; do
            while read -r dep; do
              d="${dep,,}"
              [ -n "${HAVE[$d]:-}" ] && continue
              [ -f "/c/Windows/System32/$dep" ] && continue
              case "$d" in api-ms-*|ext-ms-*) continue ;; esac
              echo "::error::$f imports $dep, which is not packaged and is not a Windows system DLL"
              MISSING=1
            done < <(MSYS_NO_PATHCONV=1 dumpbin /nologo /dependents "$f" | tr -d '\r' \
                     | awk '/^[[:space:]]+[^ ]+\.dll[[:space:]]*$/{gsub(/^[ \t]+|[ \t]+$/,""); print}')
          done
          [ "$MISSING" -eq 0 ]
          cd ..

          (cd pkg-win-core && 7z a -tzip ../AniStudio-Windows-x64.zip . > /dev/null)

          mkdir -p build/bin
          tar -czf build-env-win.tar.gz build/lib build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: Core-Windows
          path: AniStudio-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BuildEnv-Windows
          path: build-env-win.tar.gz
          if-no-files-found: error
          retention-days: 1

  # =====================================================================
  # WINDOWS PLUGINS (HIP and SYCL not built on Windows)
  # =====================================================================
  plugin-windows:
    needs: core-windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        shell: bash
        run: git submodule update --init --force --recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Conan cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-Windows-${{ hashFiles('**/conanfile.*') }}
          fail-on-cache-miss: true

      - name: Install Conan + dependencies
        shell: cmd
        run: call install.bat < nul

      - uses: actions/download-artifact@v4
        with:
          name: BuildEnv-Windows
          path: .
      - run: tar -xzf build-env-win.tar.gz

      - name: Install Vulkan SDK
        if: matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $VULKAN_VERSION = "1.4.328.1"
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/windows/vulkansdk-windows-X64-$VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$VULKAN_VERSION\bin"

      - name: Install CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      # Mirrors plugins/AniStudio-SDCPP/build.bat (default VS generator, --target <NAME>)
      - name: Build Plugin
        shell: bash
        run: |
          set -euo pipefail
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          BUILD_DIR="build/plugins/$NAME/build"
          read -ra CPUF <<< "$CPU_FLAGS"
          ARGS=(-G "Visual Studio 17 2022" -A x64 -T host=x64 "${CPUF[@]}")

          case "${{ matrix.backend }}" in
            VULKAN) ARGS+=(-DSD_VULKAN=ON) ;;
            CUDA)   ARGS+=(-DSD_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHS") ;;
          esac

          cmake -S plugins/AniStudio-SDCPP -B "$BUILD_DIR" "${ARGS[@]}"
          cmake --build "$BUILD_DIR" --config Release --target "$NAME" --parallel
          test -f "build/plugins/$NAME/staging/$NAME.dll"

      - name: Package Plugin
        shell: bash
        run: |
          set -euo pipefail
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          rm -rf pkg && mkdir -p "pkg/$NAME/staging"
          cp "build/plugins/$NAME/staging/$NAME.dll" "pkg/$NAME/staging/"
          (cd pkg && 7z a -tzip "../$NAME-windows-x64.zip" . > /dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-Windows-${{ matrix.backend }}
          path: AniStudio-SDCPP_${{ matrix.backend }}-windows-x64.zip
          if-no-files-found: error

  # =====================================================================
  # BUNDLE & RELEASE
  # =====================================================================
  bundle:
    needs: [core-linux, core-windows, plugin-linux, plugin-windows]
    # Release when both cores built; a failed plugin just means that plugin is missing.
    if: ${{ !cancelled() && needs.core-linux.result == 'success' && needs.core-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Core-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Plugin-*
          merge-multiple: true

      - name: Assemble Bundles
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          ls -R artifacts

          lin() { f="artifacts/AniStudio-SDCPP_$1-linux-x64.tar.gz"; if [ -f "$f" ]; then tar -xzf "$f" -C "$2/plugins"; else echo "::warning::missing linux plugin $1"; fi; }
          win() { f="artifacts/AniStudio-SDCPP_$1-windows-x64.zip";  if [ -f "$f" ]; then unzip -q -o "$f" -d "$2/plugins"; else echo "::warning::missing windows plugin $1"; fi; }

          for VENDOR in Nvidia AMD Intel; do
            STAGE="stage-linux-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            tar -xzf artifacts/AniStudio-Linux-x64.tar.gz -C "$STAGE"
            lin CPU "$STAGE"; lin VULKAN "$STAGE"
            case "$VENDOR" in
              Nvidia) lin CUDA "$STAGE" ;;
              AMD)    lin HIP  "$STAGE" ;;
              Intel)  lin SYCL "$STAGE" ;;
            esac
            tar -czf "AniStudio-${VENDOR}-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          done

          for VENDOR in Nvidia Intel; do
            STAGE="stage-win-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            unzip -q artifacts/AniStudio-Windows-x64.zip -d "$STAGE"
            win CPU "$STAGE"; win VULKAN "$STAGE"
            [ "$VENDOR" = "Nvidia" ] && win CUDA "$STAGE"
            (cd "$STAGE" && zip -qr "../AniStudio-${VENDOR}-Bundle-windows-x64-${SHORT_HASH}.zip" .)
          done

      - name: Generate Release Body
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then RANGE="-n 20"; AUTH="HEAD"; else RANGE="${LAST_TAG}..HEAD"; AUTH="${LAST_TAG}..HEAD"; fi
          {
            echo "## What's Changed"
            git log --pretty=format:"- %s (%h)" $RANGE
            echo
            echo
            echo "## Contributors"
            git log $AUTH --format='- %aN' | sort -u
            echo
            echo "## Notes"
            echo "- CUDA plugins need the NVIDIA CUDA 12 runtime (cudart/cublas) installed on the target machine."
          } > release_body.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          body_path: release_body.md
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            artifacts/AniStudio-Linux-x64.tar.gz
            artifacts/AniStudio-Windows-x64.zip
            artifacts/AniStudio-SDCPP_*-linux-x64.tar.gz
            artifacts/AniStudio-SDCPP_*-windows-x64.zip
            AniStudio-*-Bundle-linux-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
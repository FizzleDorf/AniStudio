name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  # =====================================================================
  # LINUX CORE
  # =====================================================================
  core-linux:
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Linux-v1
          restore-keys: conan-Linux-

      - name: Install Conan
        run: ./install.sh

      - name: Build Core
        run: |
          source build/venv/bin/activate
          ./build.sh --local --jobs $(nproc)

      - name: Package Core
        run: |
          mkdir -p pkg-linux-core/lib pkg-linux-core/bin
          cp build/AniStudio pkg-linux-core/
          cp -a build/lib/. pkg-linux-core/lib/
          cp -a build/bin/. pkg-linux-core/bin/ 2>/dev/null || true
          cp -r build/data pkg-linux-core/ 2>/dev/null || true
          cp -r build/shaders pkg-linux-core/ 2>/dev/null || true
          cp -r build/assets pkg-linux-core/ 2>/dev/null || true
          tar -czf AniStudio-Linux-x64.tar.gz -C pkg-linux-core .
          tar -czf build-env-linux.tar.gz --exclude='build/conan' --exclude='build/venv' build

      - uses: actions/upload-artifact@v4
        with: { name: Core-Linux, path: AniStudio-Linux-x64.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: BuildEnv-Linux, path: build-env-linux.tar.gz }

  # =====================================================================
  # LINUX PLUGINS (Native)
  # =====================================================================
  plugin-linux:
    needs: core-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP, SYCL]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }
      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git wget
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then sudo apt-get install -y libvulkan-dev glslc spirv-headers; fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then
            wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
            echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
            sudo apt-get update && sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel intel-oneapi-dnnl-devel intel-oneapi-tbb-devel
          fi

      - name: Setup CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "curand", "curand_dev"]'

      - name: Setup HIP
        if: matrix.backend == 'HIP'
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==10.1.0"
          echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)" >> $GITHUB_ENV
          echo "$(rocm-sdk path --bin)" >> $GITHUB_PATH

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Linux-v1
          restore-keys: conan-Linux-

      - name: Install Conan
        run: ./install.sh

      - uses: actions/download-artifact@v4
        with: { name: BuildEnv-Linux, path: . }
      - run: tar -xzf build-env-linux.tar.gz

      - name: Build Plugin (Raw CMake)
        run: |
          source build/venv/bin/activate
          cd plugins/AniStudio-SDCPP
          if [ "${{ matrix.backend }}" = "SYCL" ]; then source /opt/intel/oneapi/setvars.sh; fi
          
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=OFF"
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_VULKAN=ON"; fi
          if [ "${{ matrix.backend }}" = "CUDA" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_CUDA=ON"; fi
          if [ "${{ matrix.backend }}" = "HIP" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_HIPBLAS=ON"; fi
          if [ "${{ matrix.backend }}" = "SYCL" ]; then CMAKE_ARGS="$CMAKE_ARGS -DSD_SYCL=ON"; fi
          
          mkdir -p build-cmake
          cd build-cmake
          cmake .. -G Ninja $CMAKE_ARGS
          cmake --build . --config Release

      - name: Package Plugin
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          STAGE="../build/plugins/${PLUGIN_NAME}"
          if [ -d "$STAGE" ]; then
            tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C "$STAGE" .
          else
            echo "::warning::Staging dir not found at $STAGE"
            find .. -name "*.so" -exec tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" {} \;
          fi

      - uses: actions/upload-artifact@v4
        with: { name: Plugin-Linux-${{ matrix.backend }}, path: AniStudio-SDCPP_${{ matrix.backend }}-linux-x64.tar.gz }

  # =====================================================================
  # WINDOWS CORE
  # =====================================================================
  core-windows:
    runs-on: windows-2022
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Windows-v1
          restore-keys: conan-Windows-

      - name: Install Conan
        shell: cmd
        run: install.bat

      - name: Build Core
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          build.bat --local --jobs 8

      - name: Package Core (Flattened DLLs)
        shell: bash
        run: |
          mkdir -p pkg-win-core
          cp build/AniStudio.exe pkg-win-core/
          cp build/*.dll pkg-win-core/ 2>/dev/null || true
          cp build/lib/*.dll pkg-win-core/ 2>/dev/null || true
          
          cp -r build/data pkg-win-core/ 2>/dev/null || true
          cp -r build/shaders pkg-win-core/ 2>/dev/null || true
          cp -r build/assets pkg-win-core/ 2>/dev/null || true
          
          (cd pkg-win-core && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Windows-x64.zip -Force")
          tar -czf build-env-win.tar.gz --exclude='build/conan' --exclude='build/venv' build

      - uses: actions/upload-artifact@v4
        with: { name: Core-Windows, path: AniStudio-Windows-x64.zip }
      - uses: actions/upload-artifact@v4
        with: { name: BuildEnv-Windows, path: build-env-win.tar.gz }

  # =====================================================================
  # WINDOWS PLUGINS (Native, Raw CMake)
  # =====================================================================
  plugin-windows:
    needs: core-windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP, SYCL]
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }
      - name: Init Submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd plugins/AniStudio-SDCPP/external/stable-diffusion.cpp
          git submodule sync --recursive
          git submodule update --init --force --recursive
          cd ../../../../..

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Windows-v1
          restore-keys: conan-Windows-

      - name: Install Conan
        shell: cmd
        run: install.bat

      - uses: actions/download-artifact@v4
        with: { name: BuildEnv-Windows, path: . }
      - run: tar -xzf build-env-win.tar.gz

      - name: Install Vulkan SDK
        if: matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $VULKAN_VERSION = "1.4.328.1"
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$VULKAN_VERSION/windows/vulkansdk-windows-X64-$VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$VULKAN_VERSION\bin"

      - name: Install CUDA
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Install Intel oneAPI
        if: matrix.backend == 'SYCL'
        uses: ./.github/actions/setup-oneapi
        with:
          version: "2025.3.2.0"
          installer-url: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/1a8b9c0d-2e3f-4a5b-8c9d-0e1f2a3b4c5d/w_Intel_oneAPI_BaseKit_2025.3.2.0_offline.exe"

      - name: Install ROCm (HIP)
        if: matrix.backend == 'HIP'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==10.1.0"
          rocm-sdk init
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Build Plugin (Raw CMake)
        shell: cmd
        run: |
          call build\venv\Scripts\activate.bat
          cd plugins\AniStudio-SDCPP
          
          set CMAKE_ARGS=-DCMAKE_BUILD_TYPE=Release -DSD_BUILD_SHARED_LIBS=OFF
          if /I "${{ matrix.backend }}"=="VULKAN" set CMAKE_ARGS=%CMAKE_ARGS% -DSD_VULKAN=ON
          if /I "${{ matrix.backend }}"=="CUDA" set CMAKE_ARGS=%CMAKE_ARGS% -DSD_CUDA=ON
          if /I "${{ matrix.backend }}"=="HIP" set CMAKE_ARGS=%CMAKE_ARGS% -DSD_HIPBLAS=ON
          if /I "${{ matrix.backend }}"=="SYCL" set CMAKE_ARGS=%CMAKE_ARGS% -DSD_SYCL=ON
          
          if /I "${{ matrix.backend }}"=="HIP" (
            set CC=%HIP_PATH%\lib\llvm\bin\clang.exe
            set CXX=%HIP_PATH%\lib\llvm\bin\clang++.exe
            cmake -B build-cmake -G Ninja %CMAKE_ARGS% -DCMAKE_C_COMPILER=%CC% -DCMAKE_CXX_COMPILER=%CXX%
          ) else (
            cmake -B build-cmake -G Ninja %CMAKE_ARGS%
          )
          
          cmake --build build-cmake --config Release

      - name: Package Plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          STAGE="build/plugins/${PLUGIN_NAME}"
          if [ -d "$STAGE" ]; then
            (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../../../${PLUGIN_NAME}-windows-x64.zip -Force")
          else
            echo "::warning::Staging dir not found at $STAGE"
            find build -name "*.dll" -exec sh -c 'zip -j "$1-windows-x64.zip" "$0"' {} \;
          fi

      - uses: actions/upload-artifact@v4
        with: { name: Plugin-Windows-${{ matrix.backend }}, path: AniStudio-SDCPP_${{ matrix.backend }}-windows-x64.zip, if-no-files-found: warn }

  # =====================================================================
  # BUNDLE & RELEASE
  # =====================================================================
  bundle:
    needs: [core-linux, core-windows, plugin-linux, plugin-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      
      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      - name: Assemble Bundles
        run: |
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          for VENDOR in Nvidia AMD Intel; do
            STAGE="stage-linux-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            tar -xzf artifacts/AniStudio-Linux-x64.tar.gz -C "$STAGE"
            if [ -f "artifacts/AniStudio-SDCPP_CPU-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_CPU-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ -f "artifacts/AniStudio-SDCPP_VULKAN-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_VULKAN-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Nvidia" ] && [ -f "artifacts/AniStudio-SDCPP_CUDA-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_CUDA-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "AMD" ] && [ -f "artifacts/AniStudio-SDCPP_HIP-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_HIP-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Intel" ] && [ -f "artifacts/AniStudio-SDCPP_SYCL-linux-x64.tar.gz" ]; then tar -xzf artifacts/AniStudio-SDCPP_SYCL-linux-x64.tar.gz -C "$STAGE/plugins"; fi
            tar -czf "AniStudio-${VENDOR}-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          done

          for VENDOR in Nvidia AMD Intel; do
            STAGE="stage-win-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            unzip -q artifacts/AniStudio-Windows-x64.zip -d "$STAGE"
            if [ -f "artifacts/AniStudio-SDCPP_CPU-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_CPU-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ -f "artifacts/AniStudio-SDCPP_VULKAN-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_VULKAN-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Nvidia" ] && [ -f "artifacts/AniStudio-SDCPP_CUDA-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_CUDA-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ "$VENDOR" = "AMD" ] && [ -f "artifacts/AniStudio-SDCPP_HIP-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_HIP-windows-x64.zip -d "$STAGE/plugins"; fi
            if [ "$VENDOR" = "Intel" ] && [ -f "artifacts/AniStudio-SDCPP_SYCL-windows-x64.zip" ]; then unzip -q artifacts/AniStudio-SDCPP_SYCL-windows-x64.zip -d "$STAGE/plugins"; fi
            (cd "$STAGE" && zip -r "../AniStudio-${VENDOR}-Bundle-windows-x64-${SHORT_HASH}.zip" .)
          done

      - name: Generate Release Body
        id: release_body
        shell: bash
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # Generate changelog
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
          fi
          
          # Get unique contributors since the last tag
          if [ -z "$LAST_TAG" ]; then
            CONTRIBUTORS=$(git log --format='%aN' | sort -u)
          else
            CONTRIBUTORS=$(git log ${LAST_TAG}..HEAD --format='%aN' | sort -u)
          fi
          
          # Format contributors as a markdown list
          CONTRIB_LIST=""
          while IFS= read -r name; do
            if [ -n "$name" ]; then
              CONTRIB_LIST="${CONTRIB_LIST}- ${name}\n"
            fi
          done <<< "$CONTRIBUTORS"

          # Write to a file to avoid escaping issues
          cat <<EOF > release_body.md
          ## What's Changed
          ${CHANGELOG}

          ## Contributors
          ${CONTRIB_LIST}
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          body_path: release_body.md
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            artifacts/AniStudio-Linux-x64.tar.gz
            artifacts/AniStudio-Windows-x64.zip
            artifacts/AniStudio-SDCPP_*-linux-x64.tar.gz
            artifacts/AniStudio-SDCPP_*-windows-x64.zip
            AniStudio-*-Bundle-linux-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-unified
  cancel-in-progress: false

jobs:
  core-linux:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Init Submodules
        run: git submodule update --init --force --recursive
      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential patchelf
      - name: Setup Python venv & Conan
        run: |
          set -euo pipefail
          [ -d "build/venv" ] || python3 -m venv build/venv
          source build/venv/bin/activate
          python -m pip install --upgrade pip
          pip install conan
          conan profile detect --force
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
      - name: Build Core
        run: |
          set -euo pipefail
          source build/venv/bin/activate
          export CC=/usr/bin/gcc CXX=/usr/bin/g++ LD=/usr/bin/ld
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_APP_MODE=local -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release --parallel "$(nproc)"
          test -f build/AniStudio
      - name: Package Core
        run: |
          set -euo pipefail
          rm -rf pkg-linux-core && mkdir -p pkg-linux-core/lib
          cp build/AniStudio pkg-linux-core/
          cp -a build/lib/*.so* pkg-linux-core/lib/
          patchelf --set-rpath '$ORIGIN/lib' pkg-linux-core/AniStudio
          for so in pkg-linux-core/lib/*.so*; do [ -L "$so" ] || patchelf --set-rpath '$ORIGIN' "$so"; done
          for d in data shaders shader assets scripts docs; do [ -d "build/$d" ] && cp -r "build/$d" pkg-linux-core/ || true; done
          tar -czf AniStudio-Linux-x64.tar.gz -C pkg-linux-core .
          tar -czf build-env-linux.tar.gz build
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: Core-Linux
          path: AniStudio-Linux-x64.tar.gz
      - name: Upload BuildEnv
        uses: actions/upload-artifact@v4
        with:
          name: BuildEnv-Linux
          path: build-env-linux.tar.gz

  plugin-linux:
    needs: core-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Init Submodules
        run: git submodule update --init --force --recursive
      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git wget \
            libva-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev
          if [ "${{ matrix.backend }}" = "VULKAN" ]; then sudo apt-get install -y libvulkan-dev glslc spirv-headers; fi
      - name: Setup CUDA 13.3.1
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust"]'
      - name: Setup HIP
        if: matrix.backend == 'HIP'
        run: |
          python3 -m venv .venv && source .venv/bin/activate
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==10.1.0"
          ROCM_ROOT="$(rocm-sdk path --root)"
          echo "ROCM_PATH=$ROCM_ROOT" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(rocm-sdk path --cmake)" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_ROOT" >> $GITHUB_ENV
          echo "$(rocm-sdk path --bin)" >> $GITHUB_PATH
      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Linux-v1
          restore-keys: |
            conan-Linux-
      - name: Install Conan
        run: |
          source build/venv/bin/activate
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True
      - name: Download BuildEnv
        uses: actions/download-artifact@v4
        with:
          name: BuildEnv-Linux
          path: .
      - name: Extract BuildEnv
        run: tar -xzf build-env-linux.tar.gz
      - name: Build Plugin
        run: |
          set -euo pipefail
          source build/venv/bin/activate
          BACKEND="${{ matrix.backend }}"
          NAME="AniStudio-SDCPP_${BACKEND}"
          ADDON_DIR="$PWD/plugins/AniStudio-SDCPP"
          BUILD_DIR="$PWD/build/plugins/${NAME}/build"
          STAGING_DIR="$PWD/build/plugins/${NAME}/staging"
          mkdir -p "$BUILD_DIR" "$STAGING_DIR"
          CMAKE_ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          case "$BACKEND" in
            CPU) ;;
            VULKAN) CMAKE_ARGS+=(-DSD_VULKAN=ON) ;;
            CUDA) CMAKE_ARGS+=(-DSD_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=61;70;75;80;86;89;90;100;120") ;;
            HIP) CMAKE_ARGS+=(-DSD_HIPBLAS=ON -DHIP_PLATFORM=amd "-DCMAKE_HIP_COMPILER=$(find "$ROCM_PATH" \( -type f -o -type l \) -name clang 2>/dev/null | head -1)" "-DGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201") ;;
          esac
          cmake -S "$ADDON_DIR" -B "$BUILD_DIR" "${CMAKE_ARGS[@]}"
          cmake --build "$BUILD_DIR" --config Release --target "$NAME" --parallel "$(nproc)"
          test -f "$STAGING_DIR/${NAME}.so"
      - name: Package Plugin
        run: |
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          rm -rf pkg && mkdir -p "pkg/$NAME/staging"
          cp "build/plugins/$NAME/staging/$NAME.so" "pkg/$NAME/staging/"
          tar -czf "$NAME-linux-x64.tar.gz" -C pkg .
      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-Linux-${{ matrix.backend }}
          path: AniStudio-SDCPP_${{ matrix.backend }}-linux-x64.tar.gz

  plugin-linux-sycl:
    needs: core-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Init Submodules
        run: git submodule update --init --force --recursive
      - name: Download BuildEnv
        uses: actions/download-artifact@v4
        with:
          name: BuildEnv-Linux
          path: .
      - name: Extract BuildEnv
        run: tar -xzf build-env-linux.tar.gz
      - name: Build SYCL
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            intel/oneapi-basekit:2025.3.2-0-devel-ubuntu24.04 \
            bash -c "apt-get update && apt-get install -y cmake ninja-build git build-essential pkg-config python3 python3-pip python3-venv libva-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libgtk-3-dev && [ -d build/venv ] || python3 -m venv build/venv && source build/venv/bin/activate && pip install conan && conan profile detect --force && conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release && NAME=AniStudio-SDCPP_SYCL && BUILD_DIR=build/plugins/\${NAME}/build && STAGING_DIR=build/plugins/\${NAME}/staging && mkdir -p \$BUILD_DIR \$STAGING_DIR && source /opt/intel/oneapi/setvars.sh && cmake -S plugins/AniStudio-SDCPP -B \$BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_SYCL=ON -DSD_WEBM=OFF -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_CXX_FLAGS='-fsycl -Wno-narrowing' && cmake --build \$BUILD_DIR --config Release --target \$NAME --parallel \$(nproc) && test -f \$STAGING_DIR/\${NAME}.so"
      - name: Package Plugin
        run: |
          NAME="AniStudio-SDCPP_SYCL"
          rm -rf pkg && mkdir -p "pkg/$NAME/staging"
          cp "build/plugins/$NAME/staging/$NAME.so" "pkg/$NAME/staging/"
          tar -czf "$NAME-linux-x64.tar.gz" -C pkg .
      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-Linux-SYCL
          path: AniStudio-SDCPP_SYCL-linux-x64.tar.gz

  core-windows:
    runs-on: windows-2022
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Init Submodules
        shell: bash
        run: git submodule update --init --force --recursive
      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup Python venv
        shell: cmd
        run: |
          if not exist build mkdir build
          if exist build\venv (echo venv exists) else (python -m venv build\venv)
          call build\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install conan
      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Windows-v1
          restore-keys: |
            conan-Windows-
      - name: Install Conan deps
        shell: cmd
        run: |
          call build\venv\Scripts\activate
          conan profile detect --force
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release
      - name: Build Core
        shell: cmd
        run: |
          call build\venv\Scripts\activate
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DBUILD_APP_MODE=local -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release --parallel 8
          if not exist build\AniStudio.exe (exit /b 1)
      - name: Collect Conan runtime DLLs
        shell: bash
        run: |
          source build/venv/Scripts/activate
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release --deployer=runtime_deploy --deployer-folder=build/runtime-deploy
      - name: Package Core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pkg-win-core && mkdir -p pkg-win-core
          cp build/AniStudio.exe pkg-win-core/
          find build -maxdepth 2 -name '*.dll' -not -path 'build/conan/*' -not -path 'build/venv/*' -not -path 'build/plugins/*' -exec cp -n {} pkg-win-core/ \;
          find build/runtime-deploy -name '*.dll' -exec cp -n {} pkg-win-core/ \;
          for d in data shaders shader assets scripts docs; do [ -d "build/$d" ] && cp -r "build/$d" pkg-win-core/ || true; done
          (cd pkg-win-core && 7z a -tzip ../AniStudio-Windows-x64.zip . > /dev/null)
          tar -czf build-env-win.tar.gz build
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: Core-Windows
          path: AniStudio-Windows-x64.zip
      - name: Upload BuildEnv
        uses: actions/upload-artifact@v4
        with:
          name: BuildEnv-Windows
          path: build-env-win.tar.gz

  plugin-windows:
    needs: core-windows
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        backend: [CPU, VULKAN, CUDA, HIP]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Init Submodules
        shell: bash
        run: git submodule update --init --force --recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download BuildEnv
        uses: actions/download-artifact@v4
        with:
          name: BuildEnv-Windows
          path: .
      - name: Extract BuildEnv
        run: tar -xzf build-env-win.tar.gz
        shell: bash
      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-Windows-v1
          restore-keys: |
            conan-Windows-
      - name: Install Conan deps
        shell: cmd
        run: |
          call build\venv\Scripts\activate
          conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release
      - name: Install Vulkan SDK
        if: matrix.backend == 'VULKAN'
        shell: pwsh
        run: |
          $V = "1.4.328.1"
          curl.exe -o "$env:RUNNER_TEMP\V.exe" -L "https://sdk.lunarg.com/sdk/download/$V/windows/vulkansdk-windows-X64-$V.exe"
          & "$env:RUNNER_TEMP\V.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$V"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$V\bin"
      - name: Install CUDA 12.8.1
        if: matrix.backend == 'CUDA'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'
      - name: Install ROCm 10.1.0
        if: matrix.backend == 'HIP'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path "C:\TheRock\build" -ItemType Directory -Force | Out-Null
          python -m venv C:\TheRock\build\.venv
          & C:\TheRock\build\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://stable.repo.amd.com/rocm/whl-next/ "rocm[libraries,devel]==10.1.0"
          rocm-sdk init
          $rocmPath = (rocm-sdk path --root).Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          echo "ROCM_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH
      - name: Build Plugin
        shell: bash
        run: |
          set -euo pipefail
          source build/venv/Scripts/activate
          BACKEND="${{ matrix.backend }}"
          NAME="AniStudio-SDCPP_${BACKEND}"
          BUILD_DIR="$PWD/build/plugins/${NAME}/build"
          STAGING_DIR="$PWD/build/plugins/${NAME}/staging"
          mkdir -p "$BUILD_DIR" "$STAGING_DIR"
          CMAKE_ARGS=(-DCMAKE_BUILD_TYPE=Release)
          case "$BACKEND" in
            CPU) CMAKE_ARGS+=(-G "Visual Studio 17 2022" -A x64) ;;
            VULKAN) CMAKE_ARGS+=(-G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DSD_VULKAN=ON) ;;
            CUDA) CMAKE_ARGS+=(-G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DSD_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=61;70;75;80;86;89;90;100;120") ;;
            HIP) CMAKE_ARGS+=(-G "Unix Makefiles" -DCMAKE_C_COMPILER="$HIP_PATH\\lib\\llvm\\bin\\clang.exe" -DCMAKE_CXX_COMPILER="$HIP_PATH\\lib\\llvm\\bin\\clang++.exe" -DCMAKE_HIP_COMPILER="$HIP_PATH\\lib\\llvm\\bin\\clang.exe" -DSD_HIPBLAS=ON "-DGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201") ;;
          esac
          cmake -S plugins/AniStudio-SDCPP -B "$BUILD_DIR" "${CMAKE_ARGS[@]}"
          cmake --build "$BUILD_DIR" --config Release --target "$NAME" --parallel
          test -f "$STAGING_DIR/${NAME}.dll"
      - name: Package Plugin
        shell: bash
        run: |
          NAME="AniStudio-SDCPP_${{ matrix.backend }}"
          rm -rf pkg && mkdir -p "pkg/$NAME/staging"
          cp "build/plugins/$NAME/staging/$NAME.dll" "pkg/$NAME/staging/"
          (cd pkg && 7z a -tzip "../$NAME-windows-x64.zip" . > /dev/null)
      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-Windows-${{ matrix.backend }}
          path: AniStudio-SDCPP_${{ matrix.backend }}-windows-x64.zip

  bundle:
    needs: [core-linux, core-windows, plugin-linux, plugin-linux-sycl, plugin-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble Bundles
        run: |
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          for VENDOR in Nvidia AMD Intel; do
            STAGE="stage-linux-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            tar -xzf artifacts/AniStudio-Linux-x64.tar.gz -C "$STAGE"
            for B in CPU VULKAN CUDA HIP SYCL; do
              [ -f "artifacts/AniStudio-SDCPP_${B}-linux-x64.tar.gz" ] && tar -xzf "artifacts/AniStudio-SDCPP_${B}-linux-x64.tar.gz" -C "$STAGE/plugins"
            done
            tar -czf "AniStudio-${VENDOR}-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          done
          for VENDOR in Nvidia Intel; do
            STAGE="stage-win-${VENDOR}"
            mkdir -p "$STAGE/plugins"
            unzip -q artifacts/AniStudio-Windows-x64.zip -d "$STAGE"
            for B in CPU VULKAN CUDA HIP; do
              [ -f "artifacts/AniStudio-SDCPP_${B}-windows-x64.zip" ] && unzip -q "artifacts/AniStudio-SDCPP_${B}-windows-x64.zip" -d "$STAGE/plugins"
            done
            (cd "$STAGE" && zip -r "../AniStudio-${VENDOR}-Bundle-windows-x64-${SHORT_HASH}.zip" .)
          done
      - name: Generate Release Body
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then RANGE="-n 20"; AUTH="HEAD"; else RANGE="${LAST_TAG}..HEAD"; AUTH="${LAST_TAG}..HEAD"; fi
          {
            echo "## What's Changed"
            git log --pretty=format:"- %s (%h)" $RANGE
            echo; echo
            echo "## Contributors"
            git log $AUTH --format='- %aN' | sort -u
            echo; echo
            echo "## Notes"
            echo "- CUDA plugins use CUDA 13.3.1 (Linux) and 12.8.1 (Windows)."
            echo "- SYCL plugins are built with Intel oneAPI 2025.3.2 (Linux only)."
            echo "- Windows SYCL is not built."
          } > release_body.md
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            artifacts/AniStudio-Linux-x64.tar.gz
            artifacts/AniStudio-Windows-x64.zip
            artifacts/AniStudio-SDCPP_*-linux-x64.tar.gz
            artifacts/AniStudio-SDCPP_*-windows-x64.zip
            AniStudio-*-Bundle-linux-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
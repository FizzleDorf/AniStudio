name: Release Linux HIP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-plugin-hip-linux:
    runs-on: ubuntu-24.04

    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx900;gfx906;gfx908;gfx90a;gfx90c;gfx942;gfx950;gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Linux run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'linux-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Linux run found. Run linux-release.yml first.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify and extract core
        shell: bash
        run: |
          ls -la core-build
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/libAniEngineCore.so || test -f core-extracted/lib/AniEngineCore.so || {
            echo "::error::AniEngineCore.so missing"
            exit 1
          }
          test -f core-extracted/lib/libAniStudioCore.so || test -f core-extracted/lib/AniStudioCore.so || {
            echo "::error::AniStudioCore.so missing"
            exit 1
          }

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ubuntu-rocm-${{ env.ROCM_VERSION }}-x64
          evict-old-files: 1d

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt clean

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{matrix.ROCM_VERSION}}"
          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)
          echo "ROCM_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "PATH=$BIN_PATH:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Configure plugin (HIPBLAS Linux)
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_HIP_FLAGS="-mllvm --amdgpu-unroll-threshold-local=600" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_HIPBLAS=ON \
            -DHIP_PLATFORM=amd \
            -DGPU_TARGETS="${{ env.GPU_TARGETS }}" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DGGML_NATIVE=OFF \
            -DMAIN_LIB_DIR=$GITHUB_WORKSPACE/core-extracted/lib \
            -DMAIN_BIN_DIR=$GITHUB_WORKSPACE/core-extracted/bin \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .
          tar -tzf "${PLUGIN_NAME}-linux-x64.tar.gz" | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: AniStudio-SDCPP_*.tar.gz
          retention-days: 90

  bundle-amd-linux:
    needs: build-plugin-hip-linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Linux run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'linux-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Linux run found.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-CPU
          path: plugins/CPU
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: plugins/HIP

      - name: Verify plugin inputs
        shell: bash
        run: |
          find core plugins -type f -name "*.tar.gz" | sort
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins/CPU/*.tar.gz || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins/HIP/*.tar.gz || { echo "::error::HIP plugin tarball missing"; exit 1; }

      - name: Assemble AMD bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full
          mkdir -p full/plugins
          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            tar -xzf "$plugin_tar" -C full/plugins
          done
          find full/plugins -maxdepth 3 -type f | sort
          tar -czf AniStudio-AMD-Bundle-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-AMD-Bundle-linux-x64
          path: AniStudio-AMD-Bundle-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 90

  release-hip-linux:
    needs: [build-plugin-hip-linux, bundle-amd-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: hip-plugin

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-AMD-Bundle-linux-x64
          path: amd-bundle

      - name: Verify artifacts
        shell: bash
        run: |
          find hip-plugin amd-bundle -type f -name "*.tar.gz" | sort
          test -f hip-plugin/*.tar.gz || { echo "::error::HIP plugin tarball missing"; exit 1; }
          test -f amd-bundle/*.tar.gz || { echo "::error::AMD bundle tarball missing"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: AniStudio ${{ steps.ver.outputs.hash }}
          tag_name: ${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: |
            hip-plugin/**/*.tar.gz
            amd-bundle/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
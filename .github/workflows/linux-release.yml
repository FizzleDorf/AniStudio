name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libgtk-3-dev \
            ninja-build pkg-config build-essential

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_SHARED_LIBS=ON -DBUILD_APP_MODE=local

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build AppImage
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/AniStudio"

          cp build/AniStudio "$APPDIR/usr/bin/"

          for so in $(find build -maxdepth 1 -name "*.so*"); do
            cp "$so" "$APPDIR/usr/lib/"
          done

          ldd build/AniStudio 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
            case "$dep" in
              /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
              *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
            esac
          done

          for so in "$APPDIR/usr/lib"/*.so*; do
            [ -f "$so" ] || continue
            ldd "$so" 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
              case "$dep" in
                /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
                *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
              esac
            done
          done

          cp -r build/data    "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/shaders "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/assets  "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true

          if [ -f assets/favicom.jpg ]; then
            convert assets/favicom.jpg "$APPDIR/AniStudio.png" || \
              cp assets/favicom.jpg "$APPDIR/AniStudio.png"
          fi

          cat > "$APPDIR/AniStudio.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AniStudio
          Exec=AniStudio
          Icon=AniStudio
          Categories=Graphics;AudioVideo;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/AniStudio" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          export ARCH=x86_64

          /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-linux-x64
          path: AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage
          retention-days: 7

      - name: Package core
        shell: bash
        run: |
          mkdir -p artifact-bundle/lib artifact-bundle/bin
          cp build/AniStudio artifact-bundle/ 2>/dev/null || true
          find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/ \; 2>/dev/null || true
          find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/lib/ \; 2>/dev/null || true
          find build -maxdepth 1 -name "*.so*" -exec cp {} artifact-bundle/bin/ \; 2>/dev/null || true
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          cp build/README.md              artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-LGPL-3.0.txt   artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-COMMERCIAL.txt artifact-bundle/ 2>/dev/null || true
          tar -czf AniStudio-Linux-x64.tar.gz -C artifact-bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: AniStudio-Linux-x64.tar.gz
          retention-days: 7

  build-plugins-linux:
    needs: build-core-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: CPU,    vulkan_deps: false, cuda: false, sycl: false }
          - { backend: CUDA,   vulkan_deps: false, cuda: true,  sycl: false }
          - { backend: VULKAN, vulkan_deps: true,  cuda: false, sycl: false }
          - { backend: SYCL,   vulkan_deps: false, cuda: false, sycl: true  }

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Map backend to target suffix
        id: suffix
        shell: bash
        run: |
          case "${{ matrix.backend }}" in
            CPU)     S="_CPU" ;;
            CUDA)    S="_CUDA" ;;
            VULKAN)  S="_VULKAN" ;;
            SYCL)    S="_SYCL" ;;
            *) echo "unknown backend"; exit 1 ;;
          esac
          echo "suffix=$S" >> "$GITHUB_OUTPUT"
          echo "name=AniStudio-SDCPP$S" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libgtk-3-dev \
            ninja-build pkg-config build-essential

      - name: Install CUDA
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Install Vulkan SDK
        if: matrix.vulkan_deps
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools

      - name: Install Intel oneAPI (SYCL)
        if: matrix.sycl
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ubuntu-${{ matrix.backend }}-x64
          evict-old-files: 1d

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build

      - name: Extract core
        shell: bash
        run: tar -xzf core-build/*.tar.gz -C core-build

      - name: Configure plugin
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-build/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-build/bin \
            -DSD_${{ matrix.backend }}=ON \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="${{ steps.suffix.outputs.name }}"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-${{ matrix.backend }}
          path: AniStudio-SDCPP-*.tar.gz
          retention-days: 7

  build-plugin-hip-linux:
    needs: build-core-linux
    runs-on: ubuntu-24.04

    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx900;gfx906;gfx908;gfx90a;gfx90c;gfx942;gfx950;gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: ubuntu-rocm-${{ env.ROCM_VERSION }}-x64
          evict-old-files: 1d

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt clean

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{matrix.ROCM_VERSION}}"
          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)
          echo "ROCM_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "PATH=$BIN_PATH:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build

      - name: Extract core
        shell: bash
        run: tar -xzf core-build/*.tar.gz -C core-build

      - name: Configure plugin (HIPBLAS Linux)
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_HIP_FLAGS="-mllvm --amdgpu-unroll-threshold-local=600" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_HIPBLAS=ON \
            -DHIP_PLATFORM=amd \
            -DGPU_TARGETS="${{ env.GPU_TARGETS }}" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DGGML_NATIVE=OFF \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-build/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-build/bin \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: AniStudio-SDCPP-*.tar.gz
          retention-days: 7

  bundle-linux:
    needs: [build-core-linux, build-plugins-linux, build-plugin-hip-linux]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core

      - uses: actions/download-artifact@v4
        with:
          path: plugins
          pattern: Plugin-linux-x64-*

      - name: Assemble bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full
          mkdir -p full/plugins
          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            tar -xzf "$plugin_tar" -C full/plugins
          done
          tar -czf AniStudio-Full-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Full-linux-x64
          path: AniStudio-Full-linux-x64-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 7

  release-linux:
    needs: [build-core-linux, build-plugins-linux, build-plugin-hip-linux, bundle-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Release tag will be: ${HASH}-linux"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: |
          find artifacts -type f -name "*.tar.gz" | sort
          find artifacts -type f -name "*.AppImage" | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.hash }}-linux
          tag_name: ${{ steps.ver.outputs.hash }}-linux
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
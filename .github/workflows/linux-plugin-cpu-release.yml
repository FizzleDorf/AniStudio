name: Release Linux Plugin CPU

on:
  workflow_dispatch:
    inputs:
      core-run-id:
        description: 'Required: run ID of Release Core Linux (Actions run that produced the Linux core artifact + Conan cache).'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-plugin-cpu-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve core run ID
        id: find-core
        shell: bash
        run: echo "run-id=${{ github.event.inputs.core-run-id }}" >> "$GITHUB_OUTPUT"

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Download Conan cache from core run
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify and extract core
        shell: bash
        run: |
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/libAniEngineCore.so || test -f core-extracted/lib/AniEngineCore.so || { echo "::error::AniEngineCore.so missing"; exit 1; }
          test -f core-extracted/lib/libAniStudioCore.so || test -f core-extracted/lib/AniStudioCore.so || { echo "::error::AniStudioCore.so missing"; exit 1; }

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with: { key: ubuntu-CPU-x64, evict-old-files: 1d }

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with: { cache_packages: 'true' }

      - name: Restore Conan cache from core run
        shell: bash
        run: |
          test -f conan-cache/conan-cache.tar.gz || { echo "::error::conan cache artifact missing"; exit 1; }
          conan cache restore conan-cache/conan-cache.tar.gz

      - name: Configure Conan Center remote
        shell: bash
        run: conan remote update conancenter --url="https://center2.conan.io" || conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: test -f build/conan/conan_toolchain.cmake || { echo "::error::conan_toolchain.cmake missing"; exit 1; }

      - name: Configure plugin
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-extracted/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-extracted/bin \
            -DSD_CPU=ON -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CPU"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir $STAGE not found"; ls -la "${{ github.workspace }}/build/plugins" || true; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-CPU
          path: AniStudio-SDCPP_CPU-linux-x64.tar.gz
          retention-days: 30

      - name: Publish to AniStudio-<hash>
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: AniStudio-SDCPP_CPU-linux-x64.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
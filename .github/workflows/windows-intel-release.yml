name: Release Windows Intel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-plugin-sycl-windows:
    runs-on: windows-2022

    env:
      ONEAPI_VERSION: "2025.3.2.0"
      ONEAPI_INSTALLER_URL: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d5a6b34-6b2a-4e0a-9f3b-1234567890ab/w_Intel_oneAPI_BaseKit_2025.3.2.0_offline.exe"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Windows run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Windows run found. Run windows-release.yml first.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify and extract core
        shell: bash
        run: |
          ls -la core-build
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/AniEngineCore.lib || { echo "::error::AniEngineCore.lib missing"; exit 1; }
          test -f core-extracted/lib/AniStudioCore.lib || { echo "::error::AniStudioCore.lib missing"; exit 1; }

      - name: Cache oneAPI installer
        id: cache-oneapi
        uses: actions/cache@v4
        with:
          path: C:\oneAPI-installer.exe
          key: oneapi-${{ env.ONEAPI_VERSION }}-windows

      - name: Download oneAPI installer
        if: steps.cache-oneapi.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "$env:ONEAPI_INSTALLER_URL" -OutFile "C:\oneAPI-installer.exe"

      - name: Install oneAPI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Start-Process "C:\oneAPI-installer.exe" `
            -ArgumentList '-s', '-a', '--action', 'install', '--eula', 'accept', '--components', 'intel.oneapi.win.compiler, intel.oneapi.win.dpcpp_debugger, intel.oneapi.win.mkl.devel, intel.oneapi.win.tbb.devel' `
            -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(600000)) { $proc.Kill(); exit 1 }
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

      - name: Setup oneAPI environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setvars = "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          if (-not (Test-Path $setvars)) { Write-Error "oneAPI setvars.bat not found"; exit 1 }
          $envDump = cmd /c "`"$setvars`" intel64 > nul 2>&1 && set"
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -in @('PROMPT', 'PS1', 'TEMP', 'TMP')) { continue }
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
            }
          }

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: windows-sycl-${{ env.ONEAPI_VERSION }}-x64
          evict-old-files: 1d

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Strip VS-only generator settings from Conan toolchain
        shell: bash
        run: |
          sed -i \
            -e '/CMAKE_GENERATOR_PLATFORM/d' \
            -e '/CMAKE_GENERATOR_TOOLSET/d' \
            -e '/CMAKE_GENERATOR_INSTANCE/d' \
            build/conan/conan_toolchain.cmake
          grep -n "CMAKE_GENERATOR" build/conan/conan_toolchain.cmake || echo "  (none)"

      - name: Configure plugin (SYCL Windows)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set "Platform="
          cmake -B plugin-build -S plugins/AniStudio-SDCPP ^
            -G "Ninja" ^
            -DCMAKE_C_COMPILER=icx ^
            -DCMAKE_CXX_COMPILER=icpx ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DCMAKE_TRY_COMPILE_NO_PLATFORM_VARIABLES=TRUE ^
            -DMAIN_LIB_DIR="%GITHUB_WORKSPACE%/core-extracted/lib" ^
            -DMAIN_BIN_DIR="%GITHUB_WORKSPACE%/core-extracted/bin" ^
            -DSD_SYCL=ON ^
            -DGGML_SYCL_F16=ON ^
            -DGGML_SYCL_DNN=ON ^
            -DGGML_OPENMP=OFF ^
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build plugin-build --config Release --parallel 4

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_SYCL"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          if [ ! -d "$STAGE" ]; then
            echo "Plugin staging dir not found: $STAGE"
            ls -la "${{ github.workspace }}/build/plugins" || true
            exit 1
          fi
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/

          declare -A seen
          copy_dlls() {
            local src="$1"
            [ -d "$src" ] || return 0
            while IFS= read -r dll; do
              base="$(basename "$dll")"
              if [ -z "${seen[$base]:-}" ]; then
                cp "$dll" pkg/
                seen[$base]=1
              fi
            done < <(find "$src" -maxdepth 2 -iname "*.dll" 2>/dev/null | sort)
          }

          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin/compiler"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/mkl/latest/redist/intel64"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/tbb/latest/redist/intel64/vc_mt"
          copy_dlls "C:/Program Files (x86)/Intel/oneAPI/level_zero/latest/bin"

          if [ -f "C:/Program Files (x86)/Intel/oneAPI/licensing/license.txt" ]; then
            cp "C:/Program Files (x86)/Intel/oneAPI/licensing/license.txt" pkg/INTEL-LICENSE.txt
          fi

          tar -czf "${PLUGIN_NAME}-windows-x64.tar.gz" -C pkg .
          tar -tzf "${PLUGIN_NAME}-windows-x64.tar.gz" | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-windows-x64-SYCL
          path: AniStudio-SDCPP_*.tar.gz
          retention-days: 90

  bundle-intel-windows:
    needs: build-plugin-sycl-windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Release Windows run
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-release.yml',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful Release Windows run found.');
            }
            core.setOutput('run-id', runs.data.workflow_runs[0].id);

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-CPU
          path: plugins/CPU
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-VULKAN
          path: plugins/VULKAN
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-SYCL
          path: plugins/SYCL

      - name: Verify plugin inputs
        shell: bash
        run: |
          find core plugins -type f -name "*.tar.gz" | sort
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins/CPU/*.tar.gz || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins/VULKAN/*.tar.gz || { echo "::error::Vulkan plugin tarball missing"; exit 1; }
          test -f plugins/SYCL/*.tar.gz || { echo "::error::SYCL plugin tarball missing"; exit 1; }

      - name: Assemble Intel bundle
        shell: bash
        run: |
          mkdir -p full
          tar -xzf core/*.tar.gz -C full

          for plugin_tar in plugins/*/*.tar.gz; do
            [ -f "$plugin_tar" ] || continue
            scratch="$(mktemp -d)"
            tar -xzf "$plugin_tar" -C "$scratch"

            if [ -d "$scratch/plugins" ]; then
              mkdir -p full/plugins
              cp -r "$scratch/plugins/." full/plugins/
            fi

            while IFS= read -r f; do
              rel="${f#$scratch/}"
              case "$rel" in
                plugins|plugins/*) continue ;;
              esac
              base="$(basename "$f")"
              if [ ! -e "full/$base" ]; then
                cp "$f" "full/$base"
              fi
            done < <(find "$scratch" -maxdepth 1 -type f)

            rm -rf "$scratch"
          done

          find full -maxdepth 1 -type f | sort
          find full/plugins -maxdepth 4 -type f | sort
          tar -czf AniStudio-Intel-Bundle-windows-x64-${{ steps.ver.outputs.hash }}.tar.gz -C full .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Intel-Bundle-windows-x64
          path: AniStudio-Intel-Bundle-windows-x64-${{ steps.ver.outputs.hash }}.tar.gz
          retention-days: 90

  release-intel-windows:
    needs: [build-plugin-sycl-windows, bundle-intel-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-SYCL
          path: sycl-plugin

      - uses: actions/download-artifact@v4
        with:
          name: AniStudio-Intel-Bundle-windows-x64
          path: intel-bundle

      - name: Verify artifacts
        shell: bash
        run: |
          find sycl-plugin intel-bundle -type f -name "*.tar.gz" | sort
          test -f sycl-plugin/*.tar.gz || { echo "::error::SYCL plugin tarball missing"; exit 1; }
          test -f intel-bundle/*.tar.gz || { echo "::error::Intel bundle tarball missing"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: AniStudio ${{ steps.ver.outputs.hash }}
          tag_name: ${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: |
            sycl-plugin/**/*.tar.gz
            intel-bundle/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
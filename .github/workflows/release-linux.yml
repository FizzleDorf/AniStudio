  plugin-hip:
    needs: core
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 300
    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build

      - name: Download Conan cache
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache

      - name: Verify and extract core
        shell: bash
        run: |
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/AniEngineCore.so || test -f core-extracted/lib/libAniEngineCore.so
          test -f core-extracted/lib/AniStudioCore.so || test -f core-extracted/lib/libAniStudioCore.so

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with: { key: "ubuntu-rocm-${{ env.ROCM_VERSION }}-x64", evict-old-files: 1d }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt clean

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{ env.ROCM_VERSION }}"
          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)
          echo "ROCM_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "PATH=$BIN_PATH:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with: { cache_packages: 'true' }

      - name: Restore Conan cache
        shell: bash
        run: |
          test -f conan-cache/conan-cache.tar.gz || { echo "::error::conan cache artifact missing"; exit 1; }
          conan cache restore conan-cache/conan-cache.tar.gz

      - name: Configure Conan Center remote
        shell: bash
        run: conan remote update conancenter --url="https://center2.conan.io" || conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure plugin (HIPBLAS)
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_HIP_FLAGS="-mllvm --amdgpu-unroll-threshold-local=600" \
            -DCMAKE_BUILD_TYPE=Release -DSD_HIPBLAS=ON -DHIP_PLATFORM=amd \
            -DGPU_TARGETS="${{ env.GPU_TARGETS }}" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DGGML_NATIVE=OFF \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-extracted/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-extracted/bin \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: AniStudio-SDCPP_HIP-linux-x64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_HIP-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-sycl:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build

      - name: Download Conan cache
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache

      - name: Verify and extract core
        shell: bash
        run: |
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/AniEngineCore.so || test -f core-extracted/lib/libAniEngineCore.so
          test -f core-extracted/lib/AniStudioCore.so || test -f core-extracted/lib/libAniStudioCore.so

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Setup Intel oneAPI
        uses: ./.github/actions/setup-oneapi

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with: { key: ubuntu-sycl-x64, evict-old-files: 1d }

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with: { cache_packages: 'true' }

      - name: Restore Conan cache
        shell: bash
        run: |
          test -f conan-cache/conan-cache.tar.gz || { echo "::error::conan cache artifact missing"; exit 1; }
          conan cache restore conan-cache/conan-cache.tar.gz

      - name: Configure Conan Center remote
        shell: bash
        run: conan remote update conancenter --url="https://center2.conan.io" || conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure plugin (SYCL)
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -B plugin-build -S plugins/AniStudio-SDCPP -G Ninja \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=$GITHUB_WORKSPACE/core-extracted/lib \
            -DMAIN_BIN_DIR=$GITHUB_WORKSPACE/core-extracted/bin \
            -DSD_SYCL=ON -DGGML_SYCL_F16=ON -DGGML_SYCL_DNN=ON \
            -DGGML_OPENMP=OFF -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_SYCL"
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-SYCL
          path: AniStudio-SDCPP_SYCL-linux-x64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_SYCL-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle:
    needs: [core, plugin-cpu, plugin-vulkan, plugin-cuda, plugin-hip, plugin-sycl]
    if: always()
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core

      - name: Download available plugin artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Plugin-linux-x64-*
          path: plugins
          merge-multiple: false

      - name: Normalize plugin artifact layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins-normalized
          mkdir -p plugins-normalized/CPU plugins-normalized/VULKAN plugins-normalized/CUDA plugins-normalized/HIP plugins-normalized/SYCL
          [ -d plugins/Plugin-linux-x64-CPU ]    && cp -f plugins/Plugin-linux-x64-CPU/*    plugins-normalized/CPU/    || true
          [ -d plugins/Plugin-linux-x64-VULKAN ] && cp -f plugins/Plugin-linux-x64-VULKAN/* plugins-normalized/VULKAN/ || true
          [ -d plugins/Plugin-linux-x64-CUDA ]   && cp -f plugins/Plugin-linux-x64-CUDA/*   plugins-normalized/CUDA/   || true
          [ -d plugins/Plugin-linux-x64-HIPBLAS ]&& cp -f plugins/Plugin-linux-x64-HIPBLAS/* plugins-normalized/HIP/   || true
          [ -d plugins/Plugin-linux-x64-SYCL ]   && cp -f plugins/Plugin-linux-x64-SYCL/*   plugins-normalized/SYCL/   || true
          ls -la plugins-normalized/* || true

      - name: Verify required artifacts
        shell: bash
        run: |
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins-normalized/CPU/*.tar.gz    || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins-normalized/VULKAN/*.tar.gz || { echo "::warning::Vulkan plugin tarball missing"; }

      - name: Assemble Nvidia bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-nvidia"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/CUDA/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CUDA/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::CUDA unavailable"; fi
          tar -czf "AniStudio-Nvidia-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble AMD bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-amd"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/HIP/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/HIP/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::HIP unavailable"; fi
          tar -czf "AniStudio-AMD-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble Intel bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-intel"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/SYCL/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/SYCL/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::SYCL unavailable"; fi
          tar -czf "AniStudio-Intel-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Linux-Bundles
          path: AniStudio-*-Bundle-linux-x64-*.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Publish bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: AniStudio-*-Bundle-linux-x64-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
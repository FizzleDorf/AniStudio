name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libgtk-3-dev \
            ninja-build pkg-config build-essential

      - name: Run Install Script
        run: ./install.sh

      - name: Run Build Script
        run: ./build.sh --local --jobs $(nproc)

      - name: Verify build output
        shell: bash
        run: |
          test -f build/AniStudio || { echo "::error::AniStudio executable missing"; exit 1; }
          test -f build/lib/AniEngineCore.so || { echo "::error::AniEngineCore.so missing"; exit 1; }
          test -f build/lib/AniStudioCore.so || { echo "::error::AniStudioCore.so missing"; exit 1; }

      - name: Build AppImage
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/AniStudio"

          cp build/AniStudio "$APPDIR/usr/bin/"
          cp -r build/lib/* "$APPDIR/usr/lib/" 2>/dev/null || true

          ldd build/AniStudio 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
            case "$dep" in
              /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
              *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
            esac
          done

          for so in "$APPDIR/usr/lib"/*.so*; do
            [ -f "$so" ] || continue
            ldd "$so" 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
              case "$dep" in
                /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
                *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
              esac
            done
          done

          cp -r build/data    "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/shaders "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/assets  "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true

          if [ -f assets/favicom.jpg ]; then
            convert assets/favicom.jpg "$APPDIR/AniStudio.png" || cp assets/favicom.jpg "$APPDIR/AniStudio.png"
          fi

          cat > "$APPDIR/AniStudio.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AniStudio
          Exec=AniStudio
          Icon=AniStudio
          Categories=Graphics;AudioVideo;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/AniStudio" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          export ARCH=x86_64

          /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage"

      - name: Package core and cache
        shell: bash
        run: |
          rm -rf artifact-bundle
          mkdir -p artifact-bundle/lib artifact-bundle/bin
          cp build/AniStudio artifact-bundle/
          cp -a build/lib/. artifact-bundle/lib/
          cp -a build/bin/. artifact-bundle/bin/ 2>/dev/null || true
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          tar -czf AniStudio-Linux-x64.tar.gz -C artifact-bundle .
          
          tar -czf build-env.tar.gz build/venv build/conan

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: AniStudio-Linux-x64.tar.gz
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: build-env.tar.gz
          retention-days: 30

      - name: Publish core release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-Linux-x64.tar.gz
            AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-cpu:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: .

      - name: Extract Build Env
        run: tar -xzf build-env.tar.gz

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Run Plugin Build Script
        run: |
          cd plugins/AniStudio-SDCPP
          chmod +x "build (1).sh"
          ./"build (1).sh"

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CPU"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir $STAGE not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-CPU
          path: AniStudio-SDCPP_CPU-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_CPU-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-vulkan:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: .

      - name: Extract Build Env
        run: tar -xzf build-env.tar.gz

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools

      - name: Run Plugin Build Script
        run: |
          cd plugins/AniStudio-SDCPP
          chmod +x "build (1).sh"
          ./"build (1).sh" --vulkan

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_VULKAN"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir $STAGE not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-VULKAN
          path: AniStudio-SDCPP_VULKAN-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_VULKAN-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-cuda:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: .

      - name: Extract Build Env
        run: tar -xzf build-env.tar.gz

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'

      - name: Run Plugin Build Script
        run: |
          cd plugins/AniStudio-SDCPP
          chmod +x "build (1).sh"
          ./"build (1).sh" --cuda

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CUDA"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir $STAGE not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-CUDA
          path: AniStudio-SDCPP_CUDA-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_CUDA-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-hip:
    needs: core
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 300
    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: .

      - name: Extract Build Env
        run: tar -xzf build-env.tar.gz

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt clean

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{ env.ROCM_VERSION }}"
          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)
          echo "ROCM_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "PATH=$BIN_PATH:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Run Plugin Build Script
        run: |
          cd plugins/AniStudio-SDCPP
          chmod +x "build (1).sh"
          ./"build (1).sh" --hipblas

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: AniStudio-SDCPP_HIP-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_HIP-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-sycl:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download Core Build Env
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Build-Env-Linux
          path: .

      - name: Extract Build Env
        run: tar -xzf build-env.tar.gz

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: Setup Intel oneAPI
        uses: ./.github/actions/setup-oneapi

      - name: Run Plugin Build Script
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cd plugins/AniStudio-SDCPP
          chmod +x "build (1).sh"
          ./"build (1).sh" --sycl

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_SYCL"
          STAGE="build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-SYCL
          path: AniStudio-SDCPP_SYCL-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_SYCL-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle:
    needs: [core, plugin-cpu, plugin-vulkan, plugin-cuda, plugin-hip, plugin-sycl]
    if: always()
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core

      - name: Download available plugin artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Plugin-linux-x64-*
          path: plugins
          merge-multiple: false

      - name: Normalize plugin artifact layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins-normalized
          mkdir -p plugins-normalized/CPU plugins-normalized/VULKAN plugins-normalized/CUDA plugins-normalized/HIP plugins-normalized/SYCL
          [ -d plugins/Plugin-linux-x64-CPU ]    && cp -f plugins/Plugin-linux-x64-CPU/*    plugins-normalized/CPU/    || true
          [ -d plugins/Plugin-linux-x64-VULKAN ] && cp -f plugins/Plugin-linux-x64-VULKAN/* plugins-normalized/VULKAN/ || true
          [ -d plugins/Plugin-linux-x64-CUDA ]   && cp -f plugins/Plugin-linux-x64-CUDA/*   plugins-normalized/CUDA/   || true
          [ -d plugins/Plugin-linux-x64-HIPBLAS ]&& cp -f plugins/Plugin-linux-x64-HIPBLAS/* plugins-normalized/HIP/   || true
          [ -d plugins/Plugin-linux-x64-SYCL ]   && cp -f plugins/Plugin-linux-x64-SYCL/*   plugins-normalized/SYCL/   || true

      - name: Verify required artifacts
        shell: bash
        run: |
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins-normalized/CPU/*.tar.gz    || { echo "::error::CPU plugin tarball missing"; exit 1; }

      - name: Assemble Nvidia bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-nvidia"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/CUDA/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/CUDA/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::CUDA unavailable"; fi
          tar -czf "AniStudio-Nvidia-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble AMD bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-amd"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/HIP/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/HIP/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::HIP unavailable"; fi
          tar -czf "AniStudio-AMD-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble Intel bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="stage-intel"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins-normalized/CPU/*.tar.gz    -C "$STAGE/plugins"
          if ls plugins-normalized/VULKAN/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/VULKAN/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::Vulkan unavailable"; fi
          if ls plugins-normalized/SYCL/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins-normalized/SYCL/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::SYCL unavailable"; fi
          tar -czf "AniStudio-Intel-Bundle-linux-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Linux-Bundles
          path: AniStudio-*-Bundle-linux-x64-*.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Publish bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: AniStudio-*-Bundle-linux-x64-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
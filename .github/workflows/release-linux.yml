name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-22.04
    outputs:
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            libva-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev \
            libgtk-3-dev \
            ninja-build pkg-config build-essential

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: 'true'

      - name: Configure Conan Center remote
        shell: bash
        run: |
          conan remote update conancenter --url="https://center2.conan.io" || \
            conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: |
          conan install . --build=missing \
            -s compiler.cppstd=17 -s build_type=Release \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Verify Conan toolchain
        shell: bash
        run: |
          test -f build/conan/conan_toolchain.cmake || {
            echo "::error::build/conan/conan_toolchain.cmake missing"
            exit 1
          }

      - name: Save Conan cache (no source)
        shell: bash
        run: conan cache save "*" --file=conan-cache.tar.gz --no-source

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_SHARED_LIBS=ON -DBUILD_APP_MODE=local

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify shared libraries exist
        shell: bash
        run: |
          for f in build/lib/AniEngineCore.so build/lib/AniStudioCore.so; do
            test -f "$f" || { echo "::error::$f missing after build"; exit 1; }
          done

      - name: Build AppImage
        shell: bash
        run: |
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/AniStudio"

          cp build/AniStudio "$APPDIR/usr/bin/"
          cp -r build/lib/* "$APPDIR/usr/lib/" 2>/dev/null || true

          ldd build/AniStudio 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
            case "$dep" in
              /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
              *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
            esac
          done

          for so in "$APPDIR/usr/lib"/*.so*; do
            [ -f "$so" ] || continue
            ldd "$so" 2>/dev/null | awk '/=>/ {print $3}' | grep -v '^$' | while read dep; do
              case "$dep" in
                /lib/*|/usr/lib/*|/lib64/*|/usr/lib64/*) ;;
                *) cp -n "$dep" "$APPDIR/usr/lib/" 2>/dev/null || true ;;
              esac
            done
          done

          cp -r build/data    "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/shaders "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true
          cp -r build/assets  "$APPDIR/usr/share/AniStudio/" 2>/dev/null || true

          if [ -f assets/favicom.jpg ]; then
            convert assets/favicom.jpg "$APPDIR/AniStudio.png" || \
              cp assets/favicom.jpg "$APPDIR/AniStudio.png"
          fi

          cat > "$APPDIR/AniStudio.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AniStudio
          Exec=AniStudio
          Icon=AniStudio
          Categories=Graphics;AudioVideo;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/AniStudio" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          export ARCH=x86_64

          /tmp/appimagetool --appimage-extract-and-run "$APPDIR" \
            "AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage"

      - name: Package core
        shell: bash
        run: |
          rm -rf artifact-bundle
          mkdir -p artifact-bundle/lib artifact-bundle/bin
          cp build/AniStudio artifact-bundle/ 2>/dev/null || true
          cp -a build/lib/. artifact-bundle/lib/ 2>/dev/null || true
          cp -a build/bin/. artifact-bundle/bin/ 2>/dev/null || true
          cp -r build/data    artifact-bundle/ 2>/dev/null || true
          cp -r build/shaders artifact-bundle/ 2>/dev/null || true
          cp -r build/assets  artifact-bundle/ 2>/dev/null || true
          cp build/README.md              artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-LGPL-3.0.txt   artifact-bundle/ 2>/dev/null || true
          cp build/LICENSE-COMMERCIAL.txt artifact-bundle/ 2>/dev/null || true

          test -f artifact-bundle/lib/AniEngineCore.so || { echo "::error::AniEngineCore.so missing"; exit 1; }
          test -f artifact-bundle/lib/AniStudioCore.so || { echo "::error::AniStudioCore.so missing"; exit 1; }

          tar -czf AniStudio-Linux-x64.tar.gz -C artifact-bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: AniStudio-Linux-x64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish core release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            AniStudio-Linux-x64.tar.gz
            AniStudio-${{ steps.ver.outputs.hash }}-linux-x64.AppImage
            conan-cache.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin-cpu:
    needs: core
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build

      - name: Download Conan cache
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache

      - name: Verify and extract core
        shell: bash
        run: |
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/AniEngineCore.so || test -f core-extracted/lib/libAniEngineCore.so || { echo "::error::AniEngineCore.so missing"; exit 1; }
          test -f core-extracted/lib/AniStudioCore.so || test -f core-extracted/lib/libAniStudioCore.so || { echo "::error::AniStudioCore.so missing"; exit 1; }

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libgtk-3-dev ninja-build pkg-config build-essential

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with: { key: ubuntu-CPU-x64, evict-old-files: 1d }

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with: { cache_packages: 'true' }

      - name: Restore Conan cache
        shell: bash
        run: |
          test -f conan-cache/conan-cache.tar.gz || { echo "::error::conan cache artifact missing"; exit 1; }
          conan cache restore conan-cache/conan-cache.tar.gz

      - name: Configure Conan Center remote
        shell: bash
        run: conan remote update conancenter --url="https://center2.conan.io" || conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install
        shell: bash
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure plugin
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-extracted/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-extracted/bin \
            -DSD_CPU=ON -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_CPU"
          SHORT_HASH="${{ needs.core.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir $STAGE not found"; ls -la "${{ github.workspace }}/build/plugins" || true; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-CPU
          path: AniStudio-SDCPP_CPU-linux-x64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Publish plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ needs.core.outputs.hash }}
          name: AniStudio-${{ needs.core.outputs.hash }}
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: AniStudio-SDCPP_CPU-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: Release Linux Plugin HIP

on:
  workflow_dispatch:
    inputs:
      core-run-id:
        description: 'Required: run ID of Release Core Linux.'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-plugin-hip-linux:
    runs-on: ubuntu-24.04
    env:
      ROCM_VERSION: "7.14.0"
      GPU_TARGETS: "gfx900;gfx906;gfx908;gfx90a;gfx90c;gfx942;gfx950;gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, submodules: recursive, fetch-depth: 0 }

      - name: Initialize nested submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve core run ID
        id: find-core
        shell: bash
        run: echo "run-id=${{ github.event.inputs.core-run-id }}" >> "$GITHUB_OUTPUT"

      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Linux-x64
          path: core-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Download Conan cache from core run
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Conan-Cache-Linux-x64
          path: conan-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify and extract core
        shell: bash
        run: |
          test -f core-build/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          mkdir -p core-extracted
          tar -xzf core-build/*.tar.gz -C core-extracted
          test -f core-extracted/lib/libAniEngineCore.so || test -f core-extracted/lib/AniEngineCore.so
          test -f core-extracted/lib/libAniStudioCore.so || test -f core-extracted/lib/AniStudioCore.so

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with: { key: "ubuntu-rocm-${{ env.ROCM_VERSION }}-x64", evict-old-files: 1d }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt clean

      - name: Setup TheRock with Wheels
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://repo.amd.com/rocm/whl-multi-arch/ "rocm[libraries,devel]==${{ env.ROCM_VERSION }}"
          ROCM_PATH=$(rocm-sdk path --root)
          CMAKE_PATH=$(rocm-sdk path --cmake)
          BIN_PATH=$(rocm-sdk path --bin)
          echo "ROCM_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$CMAKE_PATH" >> $GITHUB_ENV
          echo "HIP_PATH=$ROCM_PATH" >> $GITHUB_ENV
          echo "PATH=$BIN_PATH:${PATH}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with: { cache_packages: 'true' }

      - name: Restore Conan cache from core run
        shell: bash
        run: |
          test -f conan-cache/conan-cache.tar.gz || { echo "::error::conan cache artifact missing"; exit 1; }
          conan cache restore conan-cache/conan-cache.tar.gz

      - name: Configure Conan Center remote
        shell: bash
        run: conan remote update conancenter --url="https://center2.conan.io" || conan remote add conancenter https://center2.conan.io --force

      - name: Detect Conan profile
        shell: bash
        run: conan profile detect --force

      - name: Conan install (plugin toolchain)
        shell: bash
        run: conan install . --build=missing -s compiler.cppstd=17 -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure plugin (HIPBLAS Linux)
        shell: bash
        run: |
          cmake -B plugin-build -S plugins/AniStudio-SDCPP -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_HIP_FLAGS="-mllvm --amdgpu-unroll-threshold-local=600" \
            -DCMAKE_BUILD_TYPE=Release -DSD_HIPBLAS=ON -DHIP_PLATFORM=amd \
            -DGPU_TARGETS="${{ env.GPU_TARGETS }}" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DGGML_NATIVE=OFF \
            -DMAIN_LIB_DIR=${{ github.workspace }}/core-extracted/lib \
            -DMAIN_BIN_DIR=${{ github.workspace }}/core-extracted/bin \
            -DSD_USE_SYSTEM_GGML=OFF

      - name: Build plugin
        run: cmake --build plugin-build --config Release --parallel

      - name: Package plugin
        shell: bash
        run: |
          PLUGIN_NAME="AniStudio-SDCPP_HIP"
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="${{ github.workspace }}/build/plugins/${PLUGIN_NAME}"
          test -d "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          mkdir -p pkg/plugins
          cp -r "$STAGE" pkg/plugins/
          if [ -d "pkg/plugins/${PLUGIN_NAME}/staging" ]; then
            mv "pkg/plugins/${PLUGIN_NAME}/staging" "pkg/plugins/${PLUGIN_NAME}/${SHORT_HASH}"
          fi
          tar -czf "${PLUGIN_NAME}-linux-x64.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-linux-x64-HIPBLAS
          path: AniStudio-SDCPP_HIP-linux-x64.tar.gz
          retention-days: 30

      - name: Publish to AniStudio-<hash>
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: AniStudio-SDCPP_HIP-linux-x64.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release Windows Bundles

on:
  workflow_run:
    workflows: ["Release Core Windows"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  bundle-windows:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download core
        uses: actions/download-artifact@v4
        with: { name: AniStudio-Windows-x64, path: core, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Download CPU plugin
        uses: actions/download-artifact@v4
        with: { name: Plugin-windows-x64-CPU, path: plugins/CPU, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Download Vulkan plugin
        uses: actions/download-artifact@v4
        with: { name: Plugin-windows-x64-VULKAN, path: plugins/VULKAN, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Download CUDA plugin (optional)
        id: dl-cuda
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: Plugin-windows-x64-CUDA, path: plugins/CUDA, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Download HIP plugin (optional)
        id: dl-hip
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: Plugin-windows-x64-HIPBLAS, path: plugins/HIP, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Download SYCL plugin (optional)
        id: dl-sycl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: Plugin-windows-x64-SYCL, path: plugins/SYCL, github-token: "${{ secrets.GITHUB_TOKEN }}", run-id: "${{ github.event.workflow_run.id }}" }

      - name: Verify required artifacts
        shell: bash
        run: |
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }
          test -f plugins/CPU/*.tar.gz    || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins/VULKAN/*.tar.gz || { echo "::error::Vulkan plugin tarball missing"; exit 1; }

      - name: Assemble Nvidia bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-nvidia"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/CUDA/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins/CUDA/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::CUDA unavailable"; fi
          tar -czf "AniStudio-Nvidia-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Nvidia-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - name: Assemble AMD bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-amd"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/HIP/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins/HIP/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::HIP unavailable"; fi
          tar -czf "AniStudio-AMD-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-AMD-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - name: Assemble Intel bundle
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-intel"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/SYCL/*.tar.gz >/dev/null 2>&1; then tar -xzf plugins/SYCL/*.tar.gz -C "$STAGE/plugins"; else echo "::warning::SYCL unavailable"; fi
          tar -czf "AniStudio-Intel-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .
          (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path * -DestinationPath ../AniStudio-Intel-Bundle-windows-x64-${SHORT_HASH}.zip -Force")

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Windows-Bundles
          path: |
            AniStudio-*-Bundle-windows-x64-*.tar.gz
            AniStudio-*-Bundle-windows-x64-*.zip
          retention-days: 30

      - name: Publish bundles to AniStudio-<hash>
        uses: softprops/action-gh-release@v2
        with:
          tag_name: AniStudio-${{ steps.ver.outputs.hash }}
          name: AniStudio-${{ steps.ver.outputs.hash }}
          target_commitish: ${{ github.sha }}
          files: |
            AniStudio-Nvidia-Bundle-windows-x64-*.tar.gz
            AniStudio-Nvidia-Bundle-windows-x64-*.zip
            AniStudio-AMD-Bundle-windows-x64-*.tar.gz
            AniStudio-AMD-Bundle-windows-x64-*.zip
            AniStudio-Intel-Bundle-windows-x64-*.tar.gz
            AniStudio-Intel-Bundle-windows-x64-*.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release Windows Bundles

on:
  push:
    branches: [ci/separate-plugin-workflows]
  workflow_dispatch:
    inputs:
      core-run-id:
        description: 'Optional: run ID of windows-release.yml to pull core from. Leave empty to auto-detect from this commit.'
        required: false
        type: string
  workflow_run:
    workflows: ["Release Windows"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  bundle-windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute short hash
        id: ver
        shell: bash
        run: echo "hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve core run ID
        id: find-core
        uses: actions/github-script@v7
        with:
          script: |
            const manual = '${{ github.event.inputs.core-run-id }}';
            if (manual && manual.trim() !== '') {
              core.setOutput('run-id', manual.trim());
              core.info(`Using manually supplied run-id=${manual.trim()}`);
              return;
            }
            if (context.eventName === 'workflow_run') {
              const runId = context.payload.workflow_run.id;
              core.setOutput('run-id', runId);
              core.info(`Using triggering workflow_run id=${runId}`);
              return;
            }
            const sha = context.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'windows-release.yml',
              status: 'success',
              per_page: 50
            });
            const match = runs.data.workflow_runs.find(r => r.head_sha === sha);
            if (!match) {
              core.setFailed(`No successful windows-release.yml run found for commit ${sha}. Pass core-run-id manually or run windows-release.yml first.`);
              return;
            }
            core.setOutput('run-id', match.id);
            core.info(`Matched windows-release.yml run id=${match.id} for ${sha}`);

      # ---------- Required: core ----------
      - name: Download core artifact
        uses: actions/download-artifact@v4
        with:
          name: AniStudio-Windows-x64
          path: core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify core
        shell: bash
        run: |
          find core -type f -name "*.tar.gz" | sort
          test -f core/*.tar.gz || { echo "::error::core tarball missing"; exit 1; }

      # ---------- Required: CPU + VULKAN ----------
      - name: Download CPU plugin
        uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-CPU
          path: plugins/CPU
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Download Vulkan plugin
        uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-VULKAN
          path: plugins/VULKAN
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Verify required plugins
        shell: bash
        run: |
          find plugins -type f -name "*.tar.gz" | sort
          test -f plugins/CPU/*.tar.gz    || { echo "::error::CPU plugin tarball missing"; exit 1; }
          test -f plugins/VULKAN/*.tar.gz || { echo "::error::Vulkan plugin tarball missing"; exit 1; }

      # ---------- Optional: vendor-specific plugins ----------
      - name: Download CUDA plugin (optional)
        id: dl-cuda
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-CUDA
          path: plugins/CUDA
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Download HIP plugin (optional)
        id: dl-hip
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-HIPBLAS
          path: plugins/HIP
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Download SYCL plugin (optional)
        id: dl-sycl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Plugin-windows-x64-SYCL
          path: plugins/SYCL
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-core.outputs.run-id }}

      - name: Report optional plugin availability
        shell: bash
        run: |
          for pair in "CUDA:${{ steps.dl-cuda.outcome }}" \
                      "HIP:${{ steps.dl-hip.outcome }}" \
                      "SYCL:${{ steps.dl-sycl.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            echo "OPTIONAL ${name}: ${outcome}"
          done

      # ---------- Assemble bundles ----------
      - name: Assemble Nvidia bundle (core + CPU + VULKAN + CUDA)
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-nvidia"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/CUDA/*.tar.gz >/dev/null 2>&1; then
            tar -xzf plugins/CUDA/*.tar.gz -C "$STAGE/plugins"
            echo "CUDA included in Nvidia bundle."
          else
            echo "::warning::CUDA plugin unavailable; Nvidia bundle will ship without CUDA."
          fi
          find "$STAGE/plugins" -maxdepth 3 -type f | sort
          tar -czf "AniStudio-Nvidia-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble AMD bundle (core + CPU + VULKAN + HIP)
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-amd"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/HIP/*.tar.gz >/dev/null 2>&1; then
            tar -xzf plugins/HIP/*.tar.gz -C "$STAGE/plugins"
            echo "HIP included in AMD bundle."
          else
            echo "::warning::HIP plugin unavailable; AMD bundle will ship without HIP."
          fi
          find "$STAGE/plugins" -maxdepth 3 -type f | sort
          tar -czf "AniStudio-AMD-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Assemble Intel bundle (core + CPU + VULKAN + SYCL)
        shell: bash
        run: |
          set -euo pipefail
          SHORT_HASH="${{ steps.ver.outputs.hash }}"
          STAGE="stage-intel"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf core/*.tar.gz -C "$STAGE"
          mkdir -p "$STAGE/plugins"
          tar -xzf plugins/CPU/*.tar.gz    -C "$STAGE/plugins"
          tar -xzf plugins/VULKAN/*.tar.gz -C "$STAGE/plugins"
          if ls plugins/SYCL/*.tar.gz >/dev/null 2>&1; then
            tar -xzf plugins/SYCL/*.tar.gz -C "$STAGE/plugins"
            echo "SYCL included in Intel bundle."
          else
            echo "::warning::SYCL plugin unavailable; Intel bundle will ship without SYCL."
          fi
          find "$STAGE/plugins" -maxdepth 3 -type f | sort
          tar -czf "AniStudio-Intel-Bundle-windows-x64-${SHORT_HASH}.tar.gz" -C "$STAGE" .

      - name: Verify bundles
        shell: bash
        run: |
          ls -la AniStudio-*-Bundle-windows-x64-*.tar.gz
          for f in AniStudio-Nvidia-Bundle-windows-x64-*.tar.gz \
                   AniStudio-AMD-Bundle-windows-x64-*.tar.gz \
                   AniStudio-Intel-Bundle-windows-x64-*.tar.gz; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AniStudio-Windows-Bundles
          path: AniStudio-*-Bundle-windows-x64-*.tar.gz
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.hash }}-windows
          tag_name: ${{ steps.ver.outputs.hash }}-windows
          target_commitish: ${{ github.sha }}
          files: |
            AniStudio-Nvidia-Bundle-windows-x64-*.tar.gz
            AniStudio-AMD-Bundle-windows-x64-*.tar.gz
            AniStudio-Intel-Bundle-windows-x64-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
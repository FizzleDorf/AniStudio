<!DOCTYPE html>
<html>
<head>
    <title>Alpha LSB Reader – Reliable Test</title>
</head>
<body>
    <h2>Drop your PNG here to read alpha LSBs</h2>
    <div id="drop" style="width:500px;height:200px;border:3px dashed #aaa;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        Drop PNG
    </div>
    <pre id="output" style="background:#eee;padding:10px;max-height:600px;overflow:auto;white-space:pre-wrap;font-size:12px;"></pre>

    <script>
        const drop = document.getElementById('drop');
        const output = document.getElementById('output');

        drop.addEventListener('dragover', e => e.preventDefault());
        drop.addEventListener('drop', e => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, img.width, img.height);
                    const data = imageData.data;

                    // Read alpha LSBs into a string of bits
                    let bits = '';
                    for (let i = 3; i < data.length; i += 4) {
                        bits += (data[i] & 1).toString();
                    }

                    // Convert bits to characters (8 bits per char)
                    let chars = '';
                    for (let i = 0; i < bits.length; i += 8) {
                        const byte = bits.substr(i, 8);
                        if (byte.length === 8) {
                            chars += String.fromCharCode(parseInt(byte, 2));
                        }
                    }

                    // Output the first 1000 characters
                    output.textContent = `Total pixels: ${img.width * img.height}\nTotal bits read: ${bits.length}\n\nFirst 1000 characters:\n${chars.substring(0, 1000)}\n\n`;

                    // Look for signature
                    if (chars.includes('stealth_pngcomp')) {
                        output.textContent += '✅ Found "stealth_pngcomp" signature!\n';
                    } else if (chars.includes('stealth_pnginfo')) {
                        output.textContent += '✅ Found "stealth_pnginfo" signature!\n';
                    } else {
                        output.textContent += '❌ No stealth signature found.\n';
                        // Show if there's any readable text
                        const textMatch = chars.match(/[a-zA-Z0-9_\-\s]{20,}/);
                        if (textMatch) {
                            output.textContent += `But found some readable text: "${textMatch[0]}"\n`;
                        }
                    }

                    // Try to parse if it's JSON
                    const start = chars.indexOf('stealth_pngcomp');
                    if (start !== -1) {
                        const startPos = start + 'stealth_pngcomp'.length;
                        const lenBytes = chars.substr(startPos, 4);
                        if (lenBytes.length === 4) {
                            const len = lenBytes.split('').reduce((acc, ch, i) => acc + (ch.charCodeAt(0) << (i * 8)), 0);
                            output.textContent += `Declared payload length: ${len} bytes\n`;
                            const dataStart = startPos + 4;
                            const payload = chars.substr(dataStart, len);
                            output.textContent += `First 200 chars of payload: ${payload.substring(0, 200)}\n`;
                            try {
                                JSON.parse(payload);
                                output.textContent += '✅ Payload is valid JSON.\n';
                            } catch {
                                output.textContent += '⚠️ Payload is not valid JSON (maybe compressed).\n';
                            }
                        }
                    }
                };
                img.src = URL.createObjectURL(file);
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
